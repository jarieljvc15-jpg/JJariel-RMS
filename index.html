<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="JJ Apartment Rental Management System">
  <title>JJ Apartment RMS</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,800&display=swap" rel="stylesheet">

  <!-- PWA META — added in Step 6 -->
  <link rel="manifest" href="/JJariel-RMS/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JJ Apartment">
  <link rel="apple-touch-icon" href="/JJariel-RMS/assets/icons/icon-192.png">
  <!-- END PWA META -->

  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <div class="login-logo-name">JJ Apartment</div>
      <div class="login-logo-sub">Rental Management System</div>
    </div>

    <!-- PWA INSTALL BANNER — added in Step 6 -->
    <!-- Show only when browser supports install prompt and user hasn't dismissed it -->
    <div id="pwaInstallBanner" style="display:none;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;align-items:center;gap:12px;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--accent,#3b82f6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;">
        <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
      </svg>
      <span style="flex:1;font-family:'Inter',sans-serif;font-weight:400;font-size:13px;color:var(--text-secondary,#64748b);">Add JJ Apartment to your home screen for quick access</span>
      <button id="pwaInstallAdd" style="background:var(--accent,#3b82f6);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;">Add</button>
      <button id="pwaInstallDismiss" style="background:none;border:none;font-size:18px;line-height:1;color:var(--text-muted,#94a3b8);cursor:pointer;padding:0 4px;" aria-label="Dismiss">&times;</button>
    </div>
    <!-- END PWA INSTALL BANNER -->

    <div class="login-actions">
      <button class="btn btn--primary btn--full" id="adminLoginBtn">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
          <path d="M9 21V12h6v9"/>
        </svg>
        Admin Login
      </button>
      <a href="./tenant/index.html" class="btn btn--outline btn--full">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <circle cx="9" cy="7" r="4"/>
          <path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/>
          <path d="M16 3.13a4 4 0 010 7.75M21 21v-2a4 4 0 00-3-3.87"/>
        </svg>
        Tenant Portal
      </a>
    </div>

  </div>
</div>

<!-- Admin passphrase modal -->
<div id="adminModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;align-items:center;justify-content:center;padding:24px;">
  <div style="background:var(--surface);border-radius:var(--radius);padding:28px 24px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
    <div style="font-family:'Satoshi',sans-serif;font-weight:700;font-size:18px;color:var(--text-primary);margin-bottom:6px;">Admin Access</div>
    <div style="font-size:14px;color:var(--text-muted);margin-bottom:20px;">Enter the admin passphrase to continue.</div>
    <div class="form-group" style="margin-bottom:16px;">
      <label class="form-label" for="adminPassphrase">Passphrase</label>
      <input class="form-input" type="password" id="adminPassphrase" placeholder="Enter passphrase" autocomplete="current-password">
      <div id="adminPassError" style="color:var(--danger);font-size:13px;margin-top:6px;display:none;">Passphrase cannot be empty.</div>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn--outline" id="adminModalCancel" style="flex:1;">Cancel</button>
      <button class="btn btn--primary" id="adminModalSubmit" style="flex:2;">Enter</button>
    </div>
  </div>
</div>

<!-- PWA SERVICE WORKER REGISTRATION — added in Step 6 -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/JJariel-RMS/sw.js')
        .then(function(reg) { console.log('SW registered:', reg.scope); })
        .catch(function(err) { console.log('SW registration failed:', err); });
    });
  }
</script>
<!-- END SW REGISTRATION -->

<!-- PWA INSTALL PROMPT LOGIC — added in Step 6 -->
<!-- Captures the beforeinstallprompt event and wires up the banner buttons -->
<!-- To disable: set localStorage.setItem('pwa-dismissed', 'true') in console -->
<script>
  (function () {
    var deferredPrompt = null;
    var banner = document.getElementById('pwaInstallBanner');

    // Only show banner if user hasn't dismissed it before
    if (localStorage.getItem('pwa-dismissed')) return;

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      banner.style.display = 'flex';
    });

    document.getElementById('pwaInstallAdd').addEventListener('click', function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function (result) {
        if (result.outcome === 'accepted') {
          banner.style.display = 'none';
          localStorage.setItem('pwa-dismissed', 'true');
        }
        deferredPrompt = null;
      });
    });

    document.getElementById('pwaInstallDismiss').addEventListener('click', function () {
      banner.style.display = 'none';
      localStorage.setItem('pwa-dismissed', 'true');
    });

    // Hide banner after successful install
    window.addEventListener('appinstalled', function () {
      banner.style.display = 'none';
      localStorage.setItem('pwa-dismissed', 'true');
    });
  })();
</script>
<!-- END PWA INSTALL PROMPT LOGIC -->

<script src="./assets/config.js"></script>
<script>
  (function () {
    const modal      = document.getElementById('adminModal');
    const input      = document.getElementById('adminPassphrase');
    const errMsg     = document.getElementById('adminPassError');
    const btnOpen    = document.getElementById('adminLoginBtn');
    const btnCancel  = document.getElementById('adminModalCancel');
    const btnSubmit  = document.getElementById('adminModalSubmit');

    function openModal() {
      input.value = '';
      errMsg.style.display = 'none';
      modal.style.display = 'flex';
      setTimeout(() => input.focus(), 50);
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    async function submit() {
      const val = input.value.trim();
      if (!val) {
        errMsg.textContent = 'Passphrase cannot be empty.';
        errMsg.style.display = 'block';
        input.focus();
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Checking...';
      errMsg.style.display = 'none';

      try {
        const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'validateAdminToken', adminToken: val })
        });
        const json = await res.json();

        if (!json.success) {
          throw new Error(json.error || 'Invalid passphrase.');
        }

        localStorage.setItem('adminToken', val);
        window.location.href = './admin/index.html';
      } catch (err) {
        errMsg.textContent = 'Invalid passphrase. Please try again.';
        errMsg.style.display = 'block';
        input.focus();
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Enter';
      }
    }

    btnOpen.addEventListener('click', openModal);
    btnCancel.addEventListener('click', closeModal);
    btnSubmit.addEventListener('click', submit);
    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') submit(); });
    modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });
  })();
</script>

</body>
</html>
