<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approvals — JJ Apartment RMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      position: sticky;
      top: 56px;
      z-index: 90;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 13px 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tab-btn.active {
      color: var(--accent-dark);
      border-bottom-color: var(--accent);
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .tab-count {
      background: var(--warning-bg);
      color: var(--warning);
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 600;
      padding: 1px 7px;
      font-family: 'Inter', sans-serif;
    }

    /* ── Review card ── */
    .proof-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .proof-card:active { border-color: var(--accent); box-shadow: var(--shadow-sm); }
    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .card-tenant-name {
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: var(--navy-900);
    }
    .card-unit-badge {
      display: inline-block;
      background: var(--navy-50);
      color: var(--navy-500);
      border-radius: var(--radius-sm);
      font-size: 11px;
      padding: 2px 8px;
      margin-left: 6px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Mono', monospace;
    }
    .card-time {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .card-amount-row {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .card-amount {
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 800;
      font-size: 22px;
      color: var(--navy-900);
    }
    .card-ref-pill {
      background: var(--navy-50);
      border-radius: 4px;
      font-size: 12px;
      padding: 2px 10px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Mono', monospace;
      color: var(--text-secondary);
    }
    .card-tap-hint {
      margin-top: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card-tap-hint svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── All-submissions card ── */
    .sub-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .sub-card.status-approved { border-left: 3px solid var(--success); }
    .sub-card.status-declined { border-left: 3px solid var(--danger); }
    .sub-card.status-pending  { border-left: 3px solid var(--warning); }
    .sub-card-meta {
      margin-top: 5px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: var(--text-muted);
    }
    .sub-card-decline {
      margin-top: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: var(--danger);
    }

    /* ── Filter pills ── */
    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .filter-pill {
      background: var(--navy-50);
      color: var(--text-secondary);
      border-radius: var(--radius-pill);
      padding: 6px 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 12px;
      border: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .filter-pill.active { background: var(--accent); color: #fff; }

    /* ── Panel (slide-up) ── */
    .panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      display: none;
      align-items: flex-end;
    }
    .panel-overlay.open { display: flex; }
    .panel {
      background: var(--white);
      width: 100%;
      max-height: 92vh;
      border-radius: 16px 16px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-title {
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--text-primary);
    }
    .panel-sub {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .panel-close {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .panel-close:hover { background: rgba(0,0,0,0.06); }
    .panel-close svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .panel-body {
      overflow-y: auto;
      padding: 16px;
      flex: 1;
    }

    /* ── Proof image ── */
    .proof-img-wrap {
      margin-bottom: 16px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--off-white);
    }
    .proof-img-wrap img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      display: block;
    }
    .proof-no-img {
      width: 100%;
      height: 90px;
      border: 1.5px dashed var(--border);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* ── Confirm modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--white);
      border-radius: var(--radius);
      padding: 24px 20px 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .modal-title {
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--text-primary);
    }
    .modal-sub {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── Empty / loading ── */
    .empty-state-approvals {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      text-align: center;
    }
    .empty-state-approvals svg {
      width: 40px;
      height: 40px;
      stroke: var(--success);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .empty-icon-muted svg { stroke: var(--text-muted); }
    .empty-state-title {
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 18px;
      margin-top: 12px;
    }
    .empty-state-sub {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .loading-row {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      padding: 48px 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* ── Toast ── */
    .toast-container {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      width: calc(100% - 32px);
      max-width: 400px;
    }
    .toast {
      pointer-events: auto;
      animation: toastIn 0.2s ease;
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-md);
    }
    .toast svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<script>
(function () {
  'use strict';

  var adminToken = localStorage.getItem('adminToken');

  // ── Utilities ────────────────────────────────────────────────

  function pesoHtml(n) {
    return '&#8369;' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function pesoStr(n) {
    return '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function timeAgo(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    var diffMs = Date.now() - d.getTime();
    var diffHours = diffMs / 3600000;
    if (diffHours < 1) return 'Just now';
    if (diffHours < 24) return Math.floor(diffHours) + 'h ago';
    var diffDays = Math.floor(diffMs / 86400000);
    if (diffDays < 7) return diffDays + 'd ago';
    return d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
  }

  function showToast(msg, type) {
    var c = document.getElementById('toastContainer');
    var t = document.createElement('div');
    var ok = type === 'success';
    t.className = 'toast alert alert--' + (ok ? 'success' : 'danger');
    t.innerHTML = ok
      ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span>' + esc(msg) + '</span>'
      : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>' + esc(msg) + '</span>';
    c.appendChild(t);
    setTimeout(function () { t.remove(); }, 3500);
  }

  // ── Drawer ───────────────────────────────────────────────────

  var drawer = document.getElementById('moreDrawer');
  document.getElementById('moreBtn').addEventListener('click', function () { drawer.classList.add('open'); });
  drawer.addEventListener('click', function (e) { if (e.target === drawer) drawer.classList.remove('open'); });

  // ── Tabs ─────────────────────────────────────────────────────

  var allTabLoaded = false;

  document.getElementById('tabReviewBtn').addEventListener('click', function () { setTab('review'); });
  document.getElementById('tabAllBtn').addEventListener('click', function () {
    setTab('all');
    if (!allTabLoaded) { allTabLoaded = true; loadAllTab(); }
  });

  function setTab(id) {
    var isReview = id === 'review';
    document.getElementById('tabReviewBtn').classList.toggle('active', isReview);
    document.getElementById('tabReviewBtn').setAttribute('aria-selected', isReview ? 'true' : 'false');
    document.getElementById('tabAllBtn').classList.toggle('active', !isReview);
    document.getElementById('tabAllBtn').setAttribute('aria-selected', isReview ? 'false' : 'true');
    document.getElementById('tab-review').classList.toggle('active', isReview);
    document.getElementById('tab-all').classList.toggle('active', !isReview);
  }

  // ── Needs Review tab ─────────────────────────────────────────

  var reviewProofs = [];

  function loadReviewTab() {
    document.getElementById('reviewLoading').classList.remove('hidden');
    document.getElementById('reviewEmpty').classList.add('hidden');
    document.getElementById('reviewList').classList.add('hidden');

    fetch(CONFIG.APPS_SCRIPT_URL + '?action=getProofs&status=Pending')
      .then(function (r) { return r.json(); })
      .then(function (json) {
        document.getElementById('reviewLoading').classList.add('hidden');
        if (!json.success) throw new Error(json.error || 'API error');
        reviewProofs = Array.isArray(json.data) ? json.data : [];
        var count = reviewProofs.length;
        document.getElementById('pendingBadge').textContent = count;
        document.getElementById('approvalsDot').style.display = count > 0 ? 'block' : 'none';
        if (count === 0) {
          document.getElementById('reviewEmpty').classList.remove('hidden');
        } else {
          var list = document.getElementById('reviewList');
          list.innerHTML = reviewProofs.map(renderReviewCard).join('');
          list.classList.remove('hidden');
          bindReviewCards(list);
        }
      })
      .catch(function (err) {
        document.getElementById('reviewLoading').classList.add('hidden');
        showToast(err.message || 'Failed to load pending proofs.', 'error');
      });
  }

  function renderReviewCard(proof) {
    var ref = proof.ReferenceNo || '';
    return '<div class="proof-card" data-proof-id="' + esc(proof.ProofID) + '" tabindex="0" role="button" aria-label="Review proof from ' + esc(proof.TenantName) + '">'
      + '<div class="card-header-row">'
      +   '<div style="min-width:0;overflow:hidden;">'
      +     '<span class="card-tenant-name">' + esc(proof.TenantName) + '</span>'
      +     '<span class="card-unit-badge">' + esc(proof.UnitID || '') + '</span>'
      +   '</div>'
      +   '<span class="card-time">' + timeAgo(proof.SubmittedAt) + '</span>'
      + '</div>'
      + '<div class="card-amount-row">'
      +   '<span class="card-amount">' + pesoHtml(proof.Amount) + '</span>'
      +   (ref ? '<span class="card-ref-pill">' + esc(ref) + '</span>' : '')
      +   '<span class="badge badge--pending" style="font-size:11px;">Pending</span>'
      + '</div>'
      + '<div class="card-tap-hint">'
      +   '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
      +   'Tap to review'
      + '</div>'
      + '</div>';
  }

  function bindReviewCards(container) {
    container.querySelectorAll('.proof-card').forEach(function (card) {
      card.addEventListener('click', function () {
        var id = card.getAttribute('data-proof-id');
        var proof = reviewProofs.find(function (p) { return String(p.ProofID) === String(id); });
        if (proof) openProofPanel(proof);
      });
      card.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); }
      });
    });
  }

  function removeReviewCard(proofId) {
    var card = document.querySelector('.proof-card[data-proof-id="' + proofId + '"]');
    if (card) card.remove();
    reviewProofs = reviewProofs.filter(function (p) { return String(p.ProofID) !== String(proofId); });
    var count = document.querySelectorAll('#reviewList .proof-card').length;
    document.getElementById('pendingBadge').textContent = count;
    document.getElementById('approvalsDot').style.display = count > 0 ? 'block' : 'none';
    if (count === 0) {
      document.getElementById('reviewList').classList.add('hidden');
      document.getElementById('reviewEmpty').classList.remove('hidden');
    }
  }

  // ── Proof slide-up ───────────────────────────────────────────

  var activeProof = null;

  function openProofPanel(proof) {
    activeProof = proof;

    document.getElementById('panelTenantName').textContent = proof.TenantName || '';
    document.getElementById('panelUnit').textContent = proof.UnitID ? 'Unit ' + proof.UnitID : '';

    var imgUrl = proof.ImageUrl || proof.DriveURL || '';
    if (imgUrl) {
      document.getElementById('proofImg').src = imgUrl;
      document.getElementById('proofImgWrap').classList.remove('hidden');
      document.getElementById('proofNoImg').classList.add('hidden');
    } else {
      document.getElementById('proofImgWrap').classList.add('hidden');
      document.getElementById('proofNoImg').classList.remove('hidden');
    }

    document.getElementById('panelAmount').value   = Number(proof.Amount || 0).toFixed(2);
    document.getElementById('panelRef').value      = proof.ReferenceNo || '';
    document.getElementById('panelNotes').value    = proof.Notes || '';
    document.getElementById('panelMonth').value    = (proof.BillingMonth || '').substring(0, 7);

    var sel = document.getElementById('panelBillType');
    sel.value = proof.BillType || 'Rent';
    if (!sel.value) sel.value = 'Rent';

    showActionButtons();
    document.getElementById('proofPanel').classList.add('open');
  }

  function closeProofPanel() {
    document.getElementById('proofPanel').classList.remove('open');
    activeProof = null;
  }

  function showActionButtons() {
    document.getElementById('panelActions').classList.remove('hidden');
    document.getElementById('panelDeclineForm').classList.add('hidden');
    document.getElementById('declineReasonInput').value = '';
  }

  document.getElementById('proofPanelClose').addEventListener('click', closeProofPanel);
  document.getElementById('proofPanel').addEventListener('click', function (e) {
    if (e.target === document.getElementById('proofPanel')) closeProofPanel();
  });

  function buildApprovePayload() {
    return {
      action:       'approveProof',
      adminToken:   adminToken,
      proofId:      activeProof.ProofID,
      tenantId:     activeProof.TenantID,
      amount:       parseFloat(document.getElementById('panelAmount').value) || 0,
      referenceNo:  document.getElementById('panelRef').value.trim(),
      notes:        document.getElementById('panelNotes').value.trim(),
      billingMonth: document.getElementById('panelMonth').value.trim(),
      billType:     document.getElementById('panelBillType').value
    };
  }

  function doApprove(btn) {
    var origText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Approving...';
    var proofId = activeProof.ProofID;

    fetch(CONFIG.APPS_SCRIPT_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body:    JSON.stringify(buildApprovePayload())
    })
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (!json.success) throw new Error(json.error || 'Failed to approve');
        document.getElementById('confirmModal').classList.remove('open');
        closeProofPanel();
        removeReviewCard(proofId);
        showToast('Payment approved and posted to ledger.', 'success');
      })
      .catch(function (err) {
        showToast(err.message || 'Failed to approve payment.', 'error');
        btn.disabled = false;
        btn.textContent = origText;
      });
  }

  document.getElementById('quickApproveBtn').addEventListener('click', function () {
    doApprove(this);
  });

  document.getElementById('reviewApproveBtn').addEventListener('click', function () {
    if (!activeProof) return;
    var amt  = parseFloat(document.getElementById('panelAmount').value) || 0;
    var name = activeProof.TenantName || '';
    document.getElementById('confirmModalSub').textContent = 'Post ' + pesoStr(amt) + ' to ledger for ' + name + '?';
    document.getElementById('confirmModal').classList.add('open');
  });

  document.getElementById('confirmApproveBtn').addEventListener('click', function () {
    doApprove(this);
  });

  document.getElementById('cancelApproveBtn').addEventListener('click', function () {
    document.getElementById('confirmModal').classList.remove('open');
  });
  document.getElementById('confirmModal').addEventListener('click', function (e) {
    if (e.target === document.getElementById('confirmModal'))
      document.getElementById('confirmModal').classList.remove('open');
  });

  document.getElementById('declineStartBtn').addEventListener('click', function () {
    document.getElementById('panelActions').classList.add('hidden');
    document.getElementById('panelDeclineForm').classList.remove('hidden');
    document.getElementById('declineReasonInput').focus();
  });

  document.getElementById('cancelDeclineBtn').addEventListener('click', showActionButtons);

  document.getElementById('confirmDeclineBtn').addEventListener('click', function () {
    var reason = document.getElementById('declineReasonInput').value.trim();
    if (!reason) {
      showToast('Please enter a reason for declining.', 'error');
      document.getElementById('declineReasonInput').focus();
      return;
    }
    var btn    = this;
    var proof  = activeProof;
    btn.disabled = true;
    btn.textContent = 'Declining...';

    fetch(CONFIG.APPS_SCRIPT_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body:    JSON.stringify({
        action:        'rejectProof',
        adminToken:    adminToken,
        proofId:       proof.ProofID,
        tenantId:      proof.TenantID,
        declineReason: reason
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (!json.success) throw new Error(json.error || 'Failed to decline');
        closeProofPanel();
        removeReviewCard(proof.ProofID);
        showToast('Payment declined and tenant notified.', 'success');
      })
      .catch(function (err) {
        showToast(err.message || 'Failed to decline payment.', 'error');
        btn.disabled = false;
        btn.textContent = 'Confirm Decline';
      });
  });

  // ── All Submissions tab ──────────────────────────────────────

  var allProofsData = [];
  var activeFilter  = 'all';

  function loadAllTab() {
    document.getElementById('allLoading').classList.remove('hidden');
    document.getElementById('allContent').classList.add('hidden');
    document.getElementById('allEmpty').classList.add('hidden');

    fetch(CONFIG.APPS_SCRIPT_URL + '?action=getProofs')
      .then(function (r) { return r.json(); })
      .then(function (json) {
        document.getElementById('allLoading').classList.add('hidden');
        if (!json.success) throw new Error(json.error || 'API error');
        allProofsData = Array.isArray(json.data) ? json.data : [];
        if (allProofsData.length === 0) {
          document.getElementById('allEmpty').classList.remove('hidden');
        } else {
          document.getElementById('allContent').classList.remove('hidden');
          renderAllList();
        }
      })
      .catch(function (err) {
        document.getElementById('allLoading').classList.add('hidden');
        showToast(err.message || 'Failed to load submissions.', 'error');
      });
  }

  function statusBadgeHtml(status) {
    var s = (status || '').toLowerCase();
    if (s === 'approved') return '<span class="badge badge--paid">Approved</span>';
    if (s === 'declined') return '<span class="badge badge--overdue">Declined</span>';
    return '<span class="badge badge--pending">Pending</span>';
  }

  function renderAllCard(proof) {
    var status   = proof.Status || 'Pending';
    var statusL  = status.toLowerCase();
    var ref      = proof.ReferenceNo || '';
    var month    = (proof.BillingMonth || '').substring(0, 7);
    var billType = proof.BillType || '';
    var decline  = proof.DeclineReason || '';
    var borderCls = statusL === 'approved' ? 'status-approved'
                  : statusL === 'declined' ? 'status-declined'
                  : 'status-pending';
    var meta = [];
    if (month)    meta.push(month);
    if (billType) meta.push(billType);

    return '<div class="sub-card ' + borderCls + '">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">'
      +   '<div style="min-width:0;">'
      +     '<span class="card-tenant-name">' + esc(proof.TenantName) + '</span>'
      +     '<span class="card-unit-badge">' + esc(proof.UnitID || '') + '</span>'
      +   '</div>'
      +   statusBadgeHtml(status)
      + '</div>'
      + '<div class="card-amount-row" style="margin-top:8px;">'
      +   '<span class="card-amount" style="font-size:18px;">' + pesoHtml(proof.Amount) + '</span>'
      +   (ref ? '<span class="card-ref-pill">' + esc(ref) + '</span>' : '')
      + '</div>'
      + (meta.length ? '<div class="sub-card-meta">' + esc(meta.join(' · ')) + '</div>' : '')
      + (statusL === 'declined' && decline ? '<div class="sub-card-decline">' + esc(decline) + '</div>' : '')
      + '</div>';
  }

  function renderAllList() {
    var filtered = activeFilter === 'all'
      ? allProofsData
      : allProofsData.filter(function (p) {
          return (p.Status || '').toLowerCase() === activeFilter.toLowerCase();
        });
    var list = document.getElementById('allList');
    if (!filtered.length) {
      list.innerHTML = '<div style="text-align:center;font-family:\'Inter\',sans-serif;font-size:13px;color:var(--text-muted);padding:32px 0;">No submissions match this filter.</div>';
      return;
    }
    list.innerHTML = filtered.map(renderAllCard).join('');
  }

  document.getElementById('filterPills').addEventListener('click', function (e) {
    var pill = e.target.closest('.filter-pill');
    if (!pill) return;
    document.querySelectorAll('.filter-pill').forEach(function (p) { p.classList.remove('active'); });
    pill.classList.add('active');
    activeFilter = pill.getAttribute('data-filter');
    renderAllList();
  });

  // ── Init ─────────────────────────────────────────────────────

  loadReviewTab();

})();
</script>
</body>
</html>
