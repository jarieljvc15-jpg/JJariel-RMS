<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledger — JJ Apartment RMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,800&display=swap" rel="stylesheet">
  <!-- PWA META — added in Step 6 -->
  <link rel="manifest" href="/JJariel-RMS/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JJ Apartment">
  <link rel="apple-touch-icon" href="/JJariel-RMS/assets/icons/icon-192.png">
  <!-- END PWA META -->
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .topbar-title {
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 17px;
      color: #fff;
    }
    /* Sticky filters */
    .filters-bar {
      position: sticky;
      top: 56px;
      z-index: 50;
      background: var(--off-white);
      padding: 10px 0 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
    }
    .filters-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .filters-row select,
    .filters-row input[type="month"] {
      font-size: 13px;
      padding: 7px 10px;
      flex: 1;
      min-width: 110px;
      max-width: 160px;
    }
    .filter-clear {
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 0;
      white-space: nowrap;
    }
    .filter-clear:hover { text-decoration: underline; }
    /* Summary row */
    .summary-row {
      display: flex;
      gap: 0;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin: 12px 0 14px;
      overflow: hidden;
    }
    .summary-cell {
      flex: 1;
      padding: 10px 12px;
      text-align: center;
      border-right: 1px solid var(--border);
    }
    .summary-cell:last-child { border-right: none; }
    .summary-cell-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .summary-cell-value {
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 14px;
    }
    .summary-cell-value--debit  { color: var(--danger); }
    .summary-cell-value--credit { color: var(--success); }
    .summary-cell-value--net    { color: var(--text-primary); }
    .dir-debit  { color: var(--danger); font-weight: 600; font-size: 11px; }
    .dir-credit { color: var(--success); font-weight: 600; font-size: 11px; }
    /* Type badges */
    .badge-type {
      display: inline-flex; align-items: center;
      font-size: 10px; font-weight: 600;
      border-radius: var(--radius-pill);
      padding: 2px 7px;
      white-space: nowrap;
    }
    .badge-type--bill       { background: var(--navy-100); color: var(--navy-500); }
    .badge-type--payment    { background: var(--success-bg); color: #065f46; }
    .badge-type--credit     { background: var(--accent-light); color: var(--accent-dark); }
    .badge-type--adjustment { background: var(--warning-bg); color: #92400e; }
    .ref-mono {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      color: var(--text-secondary);
    }
    /* Card layout */
    .ledger-card { background: var(--bg-card, #fff); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 8px; cursor: pointer; }
    .ledger-card:active { background: var(--navy-50, #f0f4ff); }
    .ledger-card-row1 { display: flex; align-items: center; gap: 8px; }
    .ledger-card-date { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; color: var(--text-secondary); flex: 0 0 auto; }
    .ledger-card-badge { flex: 1; }
    .ledger-card-amount { font-family: 'Nunito', 'Inter', sans-serif; font-size: 15px; font-weight: 700; flex: 0 0 auto; }
    .ledger-card-chevron { flex: 0 0 auto; color: var(--text-muted); transition: transform 250ms ease; }
    .ledger-card-chevron.open { transform: rotate(180deg); }
    .ledger-card-row2 { font-family: 'Inter', sans-serif; font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .ledger-acc-body { max-height: 0; overflow: hidden; transition: max-height 250ms ease; border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); background: var(--bg-subtle, #f9fafb); }
    .ledger-acc-body.open { max-height: 200px; }
    .ledger-acc-inner { padding: 10px 12px; }
    .ledger-acc-row-item { display: flex; gap: 8px; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
    .ledger-acc-label { color: var(--text-muted); font-size: 11px; flex: 0 0 80px; }
    .ledger-acc-value { font-size: 12px; color: var(--text-primary); }
    .ledger-acc-value--mono { font-family: 'Courier New', monospace; font-size: 11px; word-break: break-all; }
    .ledger-sort-btn { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; background: none; border: none; cursor: pointer; padding: 0 0 8px 0; display: block; }
  </style>
</head>
<body>

<!-- Topbar -->
<header class="topbar">
  <span class="topbar-title">Ledger</span>
</header>

<!-- Page content -->
<main class="page-content" style="padding-top: 0; padding-bottom: 80px;">

  <!-- Filters (sticky below topbar) -->
  <div class="filters-bar">
    <div class="filters-row">
      <select class="form-select" id="filterTenant">
        <option value="">All Tenants</option>
      </select>
      <select class="form-select" id="filterUnit">
        <option value="">All Units</option>
      </select>
      <input class="form-input" id="filterMonth" type="month">
      <button class="filter-clear" id="clearFilters">Clear filters</button>
      <button class="btn btn--accent btn--sm" id="filterBtn" style="white-space:nowrap;">Filter</button>
    </div>
  </div>

  <!-- Content area with its own padding -->
  <div style="padding: 0 0 80px;">

    <!-- Summary row -->
    <div class="summary-row" id="summaryRow">
      <div class="summary-cell">
        <div class="summary-cell-label">Debits</div>
        <div class="summary-cell-value summary-cell-value--debit" id="sumDebits">₱0.00</div>
      </div>
      <div class="summary-cell">
        <div class="summary-cell-label">Credits</div>
        <div class="summary-cell-value summary-cell-value--credit" id="sumCredits">₱0.00</div>
      </div>
      <div class="summary-cell">
        <div class="summary-cell-label">Net</div>
        <div class="summary-cell-value summary-cell-value--net" id="sumNet">₱0.00</div>
      </div>
    </div>

    <!-- Loading state -->
    <div id="loadingState" style="display:flex;align-items:center;gap:8px;padding:40px 0;justify-content:center;">
      <div class="spinner"></div>
      <span class="text-muted">Loading ledger…</span>
    </div>

    <!-- Error state -->
    <div id="errorState" class="hidden">
      <div class="alert alert--danger">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errorMsg">Failed to load data.</span>
      </div>
    </div>

    <!-- Ledger content -->
    <div id="ledgerContent" class="hidden">
      <div id="tableWrap"></div>
      <div id="emptyState" class="hidden" style="text-align:center;padding:40px 0;color:var(--text-muted);font-size:14px;">
        No transactions found for the selected filters
      </div>
    </div>
  </div>

</main>

<!-- Bottom nav -->
<nav class="bottom-nav">

<!-- More drawer -->
<div class="drawer-overlay" id="moreDrawer">
  <div class="drawer" role="dialog" aria-label="More options">
    <div class="drawer-handle"></div>
    <div class="drawer-title">More</div>
    <a href="./billing.html" class="drawer-item">

      <span class="drawer-item-label">Units</span>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script src="../assets/config.js"></script>
<script src="../assets/admin-auth.js"></script>
<script src="../assets/quick-payment.js"></script>
<script>
(function () {
  validateStoredAdminToken();

  const drawer = document.getElementById('moreDrawer');
  document.getElementById('moreBtn').addEventListener('click', () => drawer.classList.add('open'));
  drawer.addEventListener('click', (e) => { if (e.target === drawer) drawer.classList.remove('open'); });

  const now = new Date();
  const currentMonthStr = now.toISOString().substring(0, 7);

  // Default month filter to current month
  document.getElementById('filterMonth').value = currentMonthStr;

  function escHtml(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function peso(n) {
    const v = parseFloat(n) || 0;
    return '₱' + v.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function showToast(msg, type) {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    const ok = type === 'success';
    t.className = 'alert alert--' + (ok ? 'success' : 'danger') + ' toast';
    t.innerHTML = ok
      ? '<svg viewBox="0 0 24 24" width="18" height="18"><polyline points="20 6 9 17 4 12"/></svg><span>' + msg + '</span>'
      : '<svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>' + msg + '</span>';
    c.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  let allRows = [];
  let sortDir = 'desc';

  function typeBadge(type) {
    const map = {
      Bill:       'badge-type--bill',
      Payment:    'badge-type--payment',
      Credit:     'badge-type--credit',
      Adjustment: 'badge-type--adjustment'
    };
    return '<span class="badge-type ' + (map[type] || 'badge-type--bill') + '">' + escHtml(type || '—') + '</span>';
  }

  // Populate tenant & unit dropdowns
  async function initFilters() {
    try {
      const [tRes, uRes] = await Promise.all([
        fetch(CONFIG.APPS_SCRIPT_URL + '?action=getTenants').then(r => r.json()),
        fetch(CONFIG.APPS_SCRIPT_URL + '?action=getUnits').then(r => r.json())
      ]);
      if (tRes.success && tRes.data) {
        const tenantSel = document.getElementById('filterTenant');
        tRes.data.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.TenantID;
          opt.textContent = t.Name + ' (' + (t.UnitName || t.UnitID) + ')';
          tenantSel.appendChild(opt);
        });
      }
      if (uRes.success && uRes.data) {
        const unitSel = document.getElementById('filterUnit');
        uRes.data.forEach(u => {
          const opt = document.createElement('option');
          opt.value = u.UnitID;
          opt.textContent = u.UnitName + ' — ' + (u.BuildingName || u.UnitID);
          unitSel.appendChild(opt);
        });
      }
    } catch (_) {}
  }

  async function loadLedger() {
    const loading = document.getElementById('loadingState');
    const error = document.getElementById('errorState');
    const content = document.getElementById('ledgerContent');

    const tenantId = document.getElementById('filterTenant').value;
    const unitId   = document.getElementById('filterUnit').value;
    const month    = document.getElementById('filterMonth').value;

    loading.classList.remove('hidden'); loading.style.display = 'flex';
    error.classList.add('hidden');
    content.classList.add('hidden');

    const timeoutId = setTimeout(() => {
      loading.style.display = 'none';
      error.classList.remove('hidden');
      document.getElementById('errorMsg').textContent = 'Request timed out after 10 seconds.';
    }, 10000);

    try {
      let url = CONFIG.APPS_SCRIPT_URL + '?action=getLedger';
      if (tenantId) url += '&tenantId=' + encodeURIComponent(tenantId);
      if (unitId)   url += '&unitId='   + encodeURIComponent(unitId);
      if (month)    url += '&billingMonth=' + encodeURIComponent(month);

      const res  = await fetch(url);
      const json = await res.json();
      clearTimeout(timeoutId);

      if (!json.success) throw new Error(json.error || 'Failed to load ledger');

      allRows = json.data || [];
      loading.style.display = 'none';
      content.classList.remove('hidden');
      renderLedger(allRows);
    } catch (err) {
      clearTimeout(timeoutId);
      loading.style.display = 'none';
      error.classList.remove('hidden');
      document.getElementById('errorMsg').textContent = err.message || 'Failed to load ledger.';
    }
  }

  function formatDate(s) {
    const d = String(s || '').substring(0, 10);
    if (!d || d === '—') return d || '—';
    const parts = d.split('-');
    if (parts.length < 3) return d;
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const mo = parseInt(parts[1], 10) - 1;
    const day = parseInt(parts[2], 10);
    const yr = parts[0];
    return (months[mo] || parts[1]) + ' ' + day + ', ' + yr;
  }

  const chevronSvg = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

  function amountColor(type) {
    if (type === 'Payment') return 'var(--text-primary)';
    if (type === 'Credit')  return 'var(--success, #16a34a)';
    return 'var(--text-muted)';
  }

  function renderLedger(rows) {
    const tableWrap  = document.getElementById('tableWrap');
    const emptyState = document.getElementById('emptyState');

    // Sort rows by Date; ties broken by _rowIdx desc (newest-inserted entry first on same date).
    rows = rows.slice().sort((a, b) => {
      const da = String(a.Date || '');
      const db = String(b.Date || '');
      if (da !== db) {
        return sortDir === 'desc' ? (db < da ? -1 : db > da ? 1 : 0) : (da < db ? -1 : da > db ? 1 : 0);
      }
      return (b._rowIdx != null ? Number(b._rowIdx) : 0) - (a._rowIdx != null ? Number(a._rowIdx) : 0);
    });

    // Compute summary
    let debits = 0, credits = 0;
    rows.forEach(r => {
      const amt = parseFloat(r.TotalAmount) || 0;
      if (r.Direction === 'Debit')  debits  += amt;
      if (r.Direction === 'Credit') credits += amt;
    });
    const net = debits - credits;
    document.getElementById('sumDebits').textContent  = peso(debits);
    document.getElementById('sumCredits').textContent = peso(credits);
    const netEl = document.getElementById('sumNet');
    netEl.textContent = peso(Math.abs(net));
    netEl.className = 'summary-cell-value ' + (net > 0 ? 'summary-cell-value--debit' : net < 0 ? 'summary-cell-value--credit' : 'summary-cell-value--net');

    if (rows.length === 0) {
      tableWrap.innerHTML = '';
      emptyState.classList.remove('hidden');
      return;
    }
    emptyState.classList.add('hidden');

    const arrowChar = sortDir === 'desc' ? '&#8595;' : '&#8593;';

    let html = '<button class="ledger-sort-btn" id="dateSortBtn">DATE <span id="dateSortArrow">' + arrowChar + '</span></button>';

    rows.forEach((r, idx) => {
      const dateStr    = formatDate(String(r.Date || '').substring(0, 10));
      const badge      = typeBadge(r.TxnType);
      const amt        = peso(parseFloat(r.TotalAmount) || 0);
      const color      = amountColor(r.TxnType);
      const tenant     = escHtml(r.TenantName || r.TenantID || '—');
      const unit       = escHtml(r.UnitDisplayName || r.UnitID || '—');
      const month      = escHtml(String(r.BillingMonth || '—').substring(0, 7));
      const ref        = String(r.ReferenceNo || '');
      const mode       = String(r.PaymentMode || '');
      const notes      = String(r.Notes || '');
      const txnId      = String(r.TxnID || '—');
      const direction  = r.Direction === 'Debit'
        ? '<span class="dir-debit">Debit</span>'
        : '<span class="dir-credit">Credit</span>';

      let accInner = '<div class="ledger-acc-inner">'
        + '<div class="ledger-acc-row-item"><span class="ledger-acc-label">TxnID</span><span class="ledger-acc-value ledger-acc-value--mono">' + escHtml(txnId) + '</span></div>'
        + (ref   ? '<div class="ledger-acc-row-item"><span class="ledger-acc-label">Ref No</span><span class="ledger-acc-value">' + escHtml(ref) + '</span></div>' : '')
        + (notes ? '<div class="ledger-acc-row-item"><span class="ledger-acc-label">Notes</span><span class="ledger-acc-value">' + escHtml(notes) + '</span></div>' : '')
        + '<div class="ledger-acc-row-item"><span class="ledger-acc-label">Direction</span><span class="ledger-acc-value">' + direction + '</span></div>'
        + (mode  ? '<div class="ledger-acc-row-item"><span class="ledger-acc-label">Mode</span><span class="ledger-acc-value">' + escHtml(mode) + '</span></div>' : '')
        + '</div>';

      html += '<div class="ledger-card" data-idx="' + idx + '">'
        + '<div class="ledger-card-row1">'
        + '<span class="ledger-card-date">' + escHtml(dateStr) + '</span>'
        + '<span class="ledger-card-badge">' + badge + '</span>'
        + '<span class="ledger-card-amount" style="color:' + color + ';">' + amt + '</span>'
        + '<span class="ledger-card-chevron" id="chev-' + idx + '">' + chevronSvg + '</span>'
        + '</div>'
        + '<div class="ledger-card-row2">' + tenant + ' &middot; ' + unit + ' &middot; ' + month + '</div>'
        + '</div>'
        + '<div class="ledger-acc-body" id="acc-' + idx + '">' + accInner + '</div>';
    });

    tableWrap.innerHTML = html;

    // Bind date sort toggle
    document.getElementById('dateSortBtn').addEventListener('click', () => {
      sortDir = sortDir === 'desc' ? 'asc' : 'desc';
      renderLedger(allRows);
    });

    // Bind card accordion listeners — one open at a time
    tableWrap.querySelectorAll('.ledger-card').forEach(card => {
      card.addEventListener('click', () => {
        const idx = parseInt(card.dataset.idx, 10);
        if (isNaN(idx)) return;
        const accBody = document.getElementById('acc-' + idx);
        const chevron = document.getElementById('chev-' + idx);
        const isOpen  = accBody.classList.contains('open');
        // Close all
        tableWrap.querySelectorAll('.ledger-acc-body.open').forEach(el => el.classList.remove('open'));
        tableWrap.querySelectorAll('.ledger-card-chevron.open').forEach(el => el.classList.remove('open'));
        // Toggle this one
        if (!isOpen) {
          accBody.classList.add('open');
          chevron.classList.add('open');
        }
      });
    });
  }

  // Filters
  document.getElementById('filterBtn').addEventListener('click', loadLedger);
  document.getElementById('clearFilters').addEventListener('click', () => {
    document.getElementById('filterTenant').value = '';
    document.getElementById('filterUnit').value   = '';
    document.getElementById('filterMonth').value  = currentMonthStr;
    loadLedger();
  });

  async function loadPendingCount() {
    try {
      const res = await fetch(CONFIG.APPS_SCRIPT_URL + '?action=getPendingProofs');
      const json = await res.json();
      if (json.success && json.data && json.data.pendingCount > 0) {
        const dot = document.getElementById('approvalsDot');
        if (dot) dot.style.display = 'block';
      }
    } catch(e) {}
  }
  loadPendingCount();

  initFilters().then(() => loadLedger());
})();
</script>
</body>
</html>
