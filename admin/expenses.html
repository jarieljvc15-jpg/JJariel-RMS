<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses — JJ Apartment RMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .summary-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .summary-total {
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--text-primary);
    }
    .add-expense-btn {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    /* Category badges */
    .badge-cat {
      display: inline-flex; align-items: center;
      font-size: 10px; font-weight: 600;
      border-radius: var(--radius-pill);
      padding: 2px 8px;
    }
    .badge-cat--repairs  { background: var(--warning-bg); color: #92400e; }
    .badge-cat--supplies { background: var(--accent-light); color: var(--accent-dark); }
    .badge-cat--utilities { background: #f3e8ff; color: #6b21a8; }
    .badge-cat--salaries { background: var(--success-bg); color: #065f46; }
    .badge-cat--other    { background: var(--navy-100); color: var(--navy-500); }
    /* Table */
    .expenses-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th {
      text-align: left;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      background: var(--navy-50);
    }
    td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr { cursor: pointer; }
    tbody tr:hover td { background: var(--navy-50); }
    .col-amount-right {
      text-align: right;
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 700;
    }
    .notes-truncated {
      color: var(--text-muted);
      font-size: 12px;
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Panel */
    .panel-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      display: none; align-items: flex-end;
    }
    .panel-overlay.open { display: flex; }
    .panel {
      background: var(--white);
      width: 100%;
      max-height: 92vh;
      border-radius: 16px 16px 0 0;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-title {
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 700; font-size: 16px;
      color: var(--text-primary);
    }
    .panel-close {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px; border: none; background: none;
      cursor: pointer; color: var(--text-secondary);
    }
    .panel-close:hover { background: rgba(0,0,0,0.06); }
    .panel-close svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .panel-body { overflow-y: auto; padding: 16px; flex: 1; }
    .panel-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .form-group { margin-bottom: 14px; }
    /* Detail panel */
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--text-secondary); font-weight: 500; }
    .detail-value { color: var(--text-primary); font-weight: 600; text-align: right; max-width: 55%; word-break: break-word; }
    .detail-amount {
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: var(--text-primary);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<!-- Topbar -->
<header class="topbar">
  <span class="topbar-title">Expenses</span>
</header>

<!-- Page content -->
<main class="page-content">

  <!-- Summary bar -->
  <div class="summary-bar">
    <div>
      <div class="summary-total" id="summaryTotal">Total: ₱0.00</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:2px;" id="summaryPeriod"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <select class="form-select" id="monthFilter" style="font-size:13px;padding:8px 10px;">
        <option value="current">This Month</option>
        <option value="all">All Time</option>
      </select>
      <button class="btn btn--accent btn--sm add-expense-btn" id="addExpenseBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Expense
      </button>
    </div>
  </div>

  <!-- Loading state -->
  <div id="loadingState" style="display:flex;align-items:center;gap:8px;padding:40px 0;justify-content:center;">
    <div class="spinner"></div>
    <span class="text-muted">Loading expenses…</span>
  </div>

  <!-- Error state -->
  <div id="errorState" class="hidden">
    <div class="alert alert--danger">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="errorMsg">Failed to load data.</span>
    </div>
  </div>

  <!-- Expenses content -->
  <div id="expensesContent" class="hidden">
    <div class="expenses-table-wrap" id="tableWrap"></div>
    <div id="emptyState" class="hidden" style="text-align:center;padding:40px 0;color:var(--text-muted);font-size:14px;">
      No expenses recorded for this period
    </div>
  </div>

</main>

<!-- Bottom nav -->
<nav class="bottom-nav">
  <a href="./index.html" class="bottom-nav-item">
    <svg viewBox="0 0 24 24" aria-hidden="true" width="24" height="24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    <span>Home</span>
  </a>
  <a href="./tenants.html" class="bottom-nav-item">
    <svg viewBox="0 0 24 24" aria-hidden="true" width="24" height="24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
    <span>Tenants</span>
  </a>
  <a href="./billing.html" class="bottom-nav-item">
    <svg viewBox="0 0 24 24" aria-hidden="true" width="24" height="24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
    <span>Billing</span>
  </a>
  <a href="./ledger.html" class="bottom-nav-item">
    <svg viewBox="0 0 24 24" aria-hidden="true" width="24" height="24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    <span>Ledger</span>
  </a>
  <button class="bottom-nav-item active" id="moreBtn">
    <svg viewBox="0 0 24 24" aria-hidden="true" width="24" height="24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
    <span>More</span>
  </button>
</nav>

<!-- More drawer -->
<div class="drawer-overlay" id="moreDrawer">
  <div class="drawer" role="dialog" aria-label="More options">
    <div class="drawer-handle"></div>
    <div class="drawer-title">More</div>
    <a href="./units.html" class="drawer-item">
      <svg viewBox="0 0 24 24" aria-hidden="true" width="24" height="24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="drawer-item-label">Units</span>
    </a>
    <a href="./utilities.html" class="drawer-item">
      <svg viewBox="0 0 24 24" aria-hidden="true" width="24" height="24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      <span class="drawer-item-label">Utilities</span>
    </a>
    <a href="./expenses.html" class="drawer-item active">
      <svg viewBox="0 0 24 24" aria-hidden="true" width="24" height="24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      <span class="drawer-item-label">Expenses</span>
    </a>
  </div>
</div>

<!-- Add Expense slide-up -->
<div class="panel-overlay" id="addExpensePanel">
  <div class="panel" role="dialog" aria-label="Add Expense">
    <div class="panel-header">
      <div class="panel-title">Add Expense</div>
      <button class="panel-close" id="addPanelClose">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="panel-body">
      <div class="form-group">
        <label class="form-label" for="expDate">Date</label>
        <input class="form-input" id="expDate" type="date" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="expCategory">Category</label>
        <select class="form-select" id="expCategory" required>
          <option value="">Select category…</option>
          <option value="Repairs">Repairs</option>
          <option value="Supplies">Supplies</option>
          <option value="Utilities">Utilities</option>
          <option value="Salaries">Salaries</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="expAmount">Amount (₱)</label>
        <input class="form-input" id="expAmount" type="number" min="0" step="0.01" placeholder="0.00" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="expPayee">Payee</label>
        <input class="form-input" id="expPayee" type="text" placeholder="Payee name" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="expNotes">Notes (optional)</label>
        <textarea class="form-input" id="expNotes" rows="3" placeholder="Additional notes…" style="resize:none;"></textarea>
      </div>
    </div>
    <div class="panel-footer">
      <button class="btn btn--accent btn--full" id="addExpenseSubmit">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Save Expense
      </button>
    </div>
  </div>
</div>

<!-- Expense detail slide-up -->
<div class="panel-overlay" id="detailPanel">
  <div class="panel" role="dialog" aria-label="Expense Detail">
    <div class="panel-header">
      <div class="panel-title" id="detailTitle">Expense Detail</div>
      <button class="panel-close" id="detailClose">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="panel-body" id="detailBody"></div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script src="../assets/config.js"></script>
<script src="../assets/quick-payment.js"></script>
<script>
(function () {
  if (!localStorage.getItem('adminToken')) {
    window.location.href = '../index.html';
    return;
  }

  const drawer = document.getElementById('moreDrawer');
  document.getElementById('moreBtn').addEventListener('click', () => drawer.classList.add('open'));
  drawer.addEventListener('click', (e) => { if (e.target === drawer) drawer.classList.remove('open'); });

  const now = new Date();
  const currentMonthStr = now.toISOString().substring(0, 7);

  // Set default date to today
  document.getElementById('expDate').value = now.toISOString().substring(0, 10);

  function escHtml(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function peso(n) {
    return '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function formatDate(str) {
    if (!str) return '—';
    const d = new Date(str + 'T00:00:00');
    return d.toLocaleDateString('en-PH', { month: 'long', day: 'numeric', year: 'numeric' });
  }
  function showToast(msg, type) {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    const ok = type === 'success';
    t.className = 'alert alert--' + (ok ? 'success' : 'danger') + ' toast';
    t.innerHTML = ok
      ? '<svg viewBox="0 0 24 24" width="18" height="18"><polyline points="20 6 9 17 4 12"/></svg><span>' + msg + '</span>'
      : '<svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>' + msg + '</span>';
    c.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }
  async function postJSON(payload) {
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  function catBadgeClass(cat) {
    const map = {
      Repairs: 'badge-cat--repairs',
      Supplies: 'badge-cat--supplies',
      Utilities: 'badge-cat--utilities',
      Salaries: 'badge-cat--salaries',
      Other: 'badge-cat--other'
    };
    return 'badge-cat ' + (map[cat] || 'badge-cat--other');
  }

  let allExpenses = [];

  async function loadExpenses() {
    const loading = document.getElementById('loadingState');
    const error = document.getElementById('errorState');
    const content = document.getElementById('expensesContent');
    const monthFilter = document.getElementById('monthFilter').value;

    loading.classList.remove('hidden'); loading.style.display = 'flex';
    error.classList.add('hidden');
    content.classList.add('hidden');

    const timeoutId = setTimeout(() => {
      loading.style.display = 'none';
      error.classList.remove('hidden');
      document.getElementById('errorMsg').textContent = 'Request timed out after 10 seconds.';
    }, 10000);

    try {
      const monthParam = monthFilter === 'all' ? '' : currentMonthStr;
      const url = CONFIG.APPS_SCRIPT_URL + '?action=getExpenses' + (monthParam ? '&month=' + encodeURIComponent(monthParam) : '');
      const res = await fetch(url);
      const json = await res.json();
      clearTimeout(timeoutId);

      if (!json.success) throw new Error(json.error || 'Failed to load expenses');

      allExpenses = json.data || [];
      loading.style.display = 'none';
      content.classList.remove('hidden');
      renderExpenses(allExpenses, monthFilter);
    } catch (err) {
      clearTimeout(timeoutId);
      loading.style.display = 'none';
      error.classList.remove('hidden');
      document.getElementById('errorMsg').textContent = err.message || 'Failed to load expenses.';
    }
  }

  function renderExpenses(expenses, filter) {
    const tableWrap = document.getElementById('tableWrap');
    const emptyState = document.getElementById('emptyState');
    const summaryTotal = document.getElementById('summaryTotal');
    const summaryPeriod = document.getElementById('summaryPeriod');

    const total = expenses.reduce((sum, e) => sum + (parseFloat(e.Amount) || 0), 0);
    summaryTotal.textContent = 'Total: ' + peso(total);
    summaryPeriod.textContent = filter === 'all'
      ? 'All Time'
      : now.toLocaleDateString('en-PH', { month: 'long', year: 'numeric' });

    if (expenses.length === 0) {
      tableWrap.innerHTML = '';
      emptyState.classList.remove('hidden');
      return;
    }

    emptyState.classList.add('hidden');
    tableWrap.innerHTML = '<table>'
      + '<thead><tr>'
      + '<th>Date</th><th>Category</th><th>Payee</th><th style="text-align:right;">Amount</th><th>Notes</th>'
      + '</tr></thead>'
      + '<tbody>'
      + expenses.map((e, idx) => {
          const notes = String(e.Notes || '');
          const notesTrunc = notes.length > 40 ? notes.substring(0, 40) + '…' : notes;
          return '<tr data-idx="' + idx + '">'
            + '<td style="white-space:nowrap;">' + escHtml(formatDate(e.Date)) + '</td>'
            + '<td><span class="' + catBadgeClass(e.Category) + '">' + escHtml(e.Category || '—') + '</span></td>'
            + '<td>' + escHtml(e.Payee || '—') + '</td>'
            + '<td class="col-amount-right">' + peso(e.Amount) + '</td>'
            + '<td><div class="notes-truncated">' + escHtml(notesTrunc || '—') + '</div></td>'
            + '</tr>';
        }).join('')
      + '</tbody></table>';

    tableWrap.querySelectorAll('tbody tr').forEach(row => {
      row.addEventListener('click', () => {
        const idx = parseInt(row.dataset.idx, 10);
        if (!isNaN(idx)) openDetail(allExpenses[idx]);
      });
    });
  }

  function openDetail(e) {
    const notes = String(e.Notes || '');
    document.getElementById('detailTitle').textContent = e.Category + ' — ' + formatDate(e.Date);
    document.getElementById('detailBody').innerHTML =
      '<div class="detail-amount">' + peso(e.Amount) + '</div>'
      + '<div class="detail-row"><span class="detail-label">Date</span><span class="detail-value">' + escHtml(formatDate(e.Date)) + '</span></div>'
      + '<div class="detail-row"><span class="detail-label">Category</span><span class="detail-value"><span class="' + catBadgeClass(e.Category) + '">' + escHtml(e.Category || '—') + '</span></span></div>'
      + '<div class="detail-row"><span class="detail-label">Payee</span><span class="detail-value">' + escHtml(e.Payee || '—') + '</span></div>'
      + '<div class="detail-row"><span class="detail-label">Expense ID</span><span class="detail-value" style="font-family:monospace;font-size:11px;">' + escHtml(e.ExpenseID || '—') + '</span></div>'
      + (notes ? '<div class="detail-row"><span class="detail-label">Notes</span><span class="detail-value">' + escHtml(notes) + '</span></div>' : '');
    document.getElementById('detailPanel').classList.add('open');
  }

  // Month filter change
  document.getElementById('monthFilter').addEventListener('change', loadExpenses);

  // Add Expense panel
  document.getElementById('addExpenseBtn').addEventListener('click', () => {
    document.getElementById('addExpensePanel').classList.add('open');
  });
  document.getElementById('addPanelClose').addEventListener('click', () => {
    document.getElementById('addExpensePanel').classList.remove('open');
  });
  document.getElementById('addExpensePanel').addEventListener('click', (e) => {
    if (e.target === document.getElementById('addExpensePanel'))
      document.getElementById('addExpensePanel').classList.remove('open');
  });

  // Detail panel close
  document.getElementById('detailClose').addEventListener('click', () => {
    document.getElementById('detailPanel').classList.remove('open');
  });
  document.getElementById('detailPanel').addEventListener('click', (e) => {
    if (e.target === document.getElementById('detailPanel'))
      document.getElementById('detailPanel').classList.remove('open');
  });

  // Submit add expense
  document.getElementById('addExpenseSubmit').addEventListener('click', async function () {
    const date     = document.getElementById('expDate').value.trim();
    const category = document.getElementById('expCategory').value;
    const amount   = parseFloat(document.getElementById('expAmount').value) || 0;
    const payee    = document.getElementById('expPayee').value.trim();
    const notes    = document.getElementById('expNotes').value.trim();

    if (!date || !category || amount <= 0 || !payee) {
      showToast('Please fill in all required fields.', 'error');
      return;
    }

    this.disabled = true;
    this.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;"></div> Saving…';

    try {
      const json = await postJSON({
        action:    'addExpense',
        adminToken: localStorage.getItem('adminToken'),
        date, category, amount, payee, notes
      });

      if (!json.success) throw new Error(json.error || 'Failed to save expense');

      showToast('Expense saved.', 'success');
      document.getElementById('addExpensePanel').classList.remove('open');

      // Reset form
      document.getElementById('expDate').value = now.toISOString().substring(0, 10);
      document.getElementById('expCategory').value = '';
      document.getElementById('expAmount').value = '';
      document.getElementById('expPayee').value = '';
      document.getElementById('expNotes').value = '';

      await loadExpenses();
    } catch (err) {
      showToast(err.message || 'Failed to save expense', 'error');
    } finally {
      this.disabled = false;
      this.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Save Expense';
    }
  });

  loadExpenses();
})();
</script>
</body>
</html>
