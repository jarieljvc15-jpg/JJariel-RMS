<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses — JJ Apartment RMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,800&display=swap" rel="stylesheet">
  <!-- PWA META — added in Step 6 -->
  <link rel="manifest" href="/JJariel-RMS/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JJ Apartment">
  <link rel="apple-touch-icon" href="/JJariel-RMS/assets/icons/icon-192.png">
  <!-- END PWA META -->
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .topbar-title {
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 17px;
      color: #fff;
    }
    .summary-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .summary-total {
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--text-primary);
    }
    .add-expense-btn {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    /* Category badges */
    .badge-cat {
      display: inline-flex; align-items: center;
      font-size: 10px; font-weight: 600;
      border-radius: var(--radius-pill);
      padding: 2px 8px;
    }
    .badge-cat--repairs  { background: var(--warning-bg); color: #92400e; }
    .badge-cat--supplies { background: var(--accent-light); color: var(--accent-dark); }
    .badge-cat--utilities { background: #f3e8ff; color: #6b21a8; }
    .badge-cat--salaries { background: var(--success-bg); color: #065f46; }
    .badge-cat--other    { background: var(--navy-100); color: var(--navy-500); }
    /* Table */
    .expenses-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th {
      text-align: left;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      background: var(--navy-50);
    }
    td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr.expense-tr { cursor: pointer; }
    tbody tr.expense-tr:hover td { background: var(--navy-50); }
    .col-amount-right {
      text-align: right;
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 700;
    }
    .notes-truncated {
      color: var(--text-muted);
      font-size: 12px;
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Panel */
    .panel-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      display: none; align-items: flex-end;
    }
    .panel-overlay.open { display: flex; }
    .panel {
      background: var(--white);
      width: 100%;
      max-height: 92vh;
      border-radius: 16px 16px 0 0;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-title {
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 700; font-size: 16px;
      color: var(--text-primary);
    }
    .panel-close {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px; border: none; background: none;
      cursor: pointer; color: var(--text-secondary);
    }
    .panel-close:hover { background: rgba(0,0,0,0.06); }
    .panel-close svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .panel-body { overflow-y: auto; padding: 16px; flex: 1; }
    .panel-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .form-group { margin-bottom: 14px; }
    /* Detail panel */
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--text-secondary); font-weight: 500; }
    .detail-value { color: var(--text-primary); font-weight: 600; text-align: right; max-width: 55%; word-break: break-word; }
    .detail-amount {
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: var(--text-primary);
      margin-bottom: 16px;
    }
    /* 3-dot menu */
    .expense-dot-btn { background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:6px;color:var(--text-secondary); }
    .expense-dot-btn:hover { background:var(--bg-subtle,#f3f4f6); }
    .expense-dot-menu { position:absolute;right:8px;background:var(--white,#fff);border:1px solid var(--border,#e5e7eb);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,0.12);z-index:50;min-width:120px; }
    .expense-dot-menu button { display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:none;cursor:pointer;font-size:14px;color:var(--text-primary,#111827); }
    .expense-dot-menu button:hover { background:var(--bg-subtle,#f3f4f6); }
    .expense-dot-menu button.delete-opt { color:var(--danger,#ef4444); }
    .expense-dot-wrap { position:relative;display:inline-block; }
    /* Accordion */
    .expense-acc-body { max-height:0;overflow:hidden;transition:max-height 250ms ease; }
    .expense-acc-body.open { max-height:400px; }
    .expense-acc-row { background:var(--bg-subtle,#f9fafb); }
    .expense-acc-row td { padding:0 !important; }
    /* Accordion inner content */
    .expense-acc-inner { padding: 10px 12px 12px 12px; }
    .expense-acc-detail-row { display: flex; gap: 8px; font-size: 12px; margin-bottom: 8px; }
    .expense-acc-label { color: var(--text-muted); font-size: 11px; min-width: 60px; }
    .expense-acc-value { color: var(--text-secondary); font-size: 12px; }
    .expense-acc-actions { display: flex; gap: 8px; margin-top: 4px; }
    /* Chevron */
    .expense-chevron-cell { padding: 0 8px; text-align: center; }
    .expense-chevron { transition: transform 250ms ease; }
    .expense-chevron.open { transform: rotate(90deg); }
    /* Confirm modal */
    .confirm-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .confirm-overlay.open { display: flex; }
    .confirm-dialog {
      background: var(--white, #fff);
      border-radius: 14px;
      padding: 24px 20px 18px;
      max-width: 320px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .confirm-title {
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .confirm-body {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .confirm-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
  </style>
</head>
<body>

<!-- Topbar -->
<header class="topbar">
  <span class="topbar-title">Expenses</span>
</header>

<!-- Page content -->
<main class="page-content" style="padding-bottom: 80px;">

  <!-- Summary bar -->
  <div class="summary-bar">
    <div>
      <div class="summary-total" id="summaryTotal">Total: ₱0.00</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:2px;" id="summaryPeriod"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <select class="form-select" id="monthFilter" style="font-size:13px;padding:8px 10px;">
        <option value="current">This Month</option>
        <option value="all">All Time</option>
      </select>
      <button class="btn btn--accent btn--sm add-expense-btn" id="addExpenseBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Expense
      </button>
    </div>
  </div>

  <!-- Loading state -->
  <div id="loadingState" style="display:flex;align-items:center;gap:8px;padding:40px 0;justify-content:center;">
    <div class="spinner"></div>
    <span class="text-muted">Loading expenses…</span>
  </div>

  <!-- Error state -->
  <div id="errorState" class="hidden">
    <div class="alert alert--danger">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="errorMsg">Failed to load data.</span>
    </div>
  </div>

  <!-- Expenses content -->
  <div id="expensesContent" class="hidden">
    <div class="expenses-table-wrap" id="tableWrap"></div>
    <div id="emptyState" class="hidden" style="text-align:center;padding:40px 0;color:var(--text-muted);font-size:14px;">
      No expenses recorded for this period
    </div>
  </div>

</main>

<!-- Bottom nav -->
<nav class="bottom-nav">
  <a href="./index.html" class="bottom-nav-item">
    <svg viewBox="0 0 24 24" aria-hidden="true" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
    <span>Home</span>
  </a>
  <a href="./tenants.html" class="bottom-nav-item">
    <svg viewBox="0 0 24 24" aria-hidden="true" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><path d="M16 3.13a4 4 0 010 7.75M21 21v-2a4 4 0 00-3-3.87"/></svg>
    <span>Tenants</span>
  </a>
  <a href="./approvals.html" class="bottom-nav-item">

      <svg viewBox="0 0 24 24" aria-hidden="true" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span id="approvalsDot" style="display:none;position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:var(--warning);border-radius:50%;"></span>
    </span>

    <span>More</span>
  </button>
</nav>

<!-- More drawer -->
<div class="drawer-overlay" id="moreDrawer">
  <div class="drawer" role="dialog" aria-label="More options">
    <div class="drawer-handle"></div>
    <div class="drawer-title">More</div>
    <a href="./billing.html" class="drawer-item">
      <svg viewBox="0 0 24 24" aria-hidden="true" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      <span class="drawer-item-label">Billing</span>
    </a>
    <a href="./units.html" class="drawer-item">
      <svg viewBox="0 0 24 24" aria-hidden="true" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="drawer-item-label">Units</span>
    </a>
    <a href="./utilities.html" class="drawer-item">
      <svg viewBox="0 0 24 24" aria-hidden="true" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      <span class="drawer-item-label">Utilities</span>
    </a>
    <a href="./expenses.html" class="drawer-item" style="background:var(--accent-light);">
      <svg viewBox="0 0 24 24" aria-hidden="true" width="24" height="24" fill="none" stroke="var(--accent-dark)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      <span class="drawer-item-label" style="color:var(--accent-dark);">Expenses</span>
    </a>
  </div>
</div>

<!-- Add / Edit Expense slide-up -->
<div class="panel-overlay" id="addExpensePanel">
  <div class="panel" role="dialog" aria-label="Add Expense">
    <div class="panel-header">
      <div class="panel-title" id="addPanelTitle">Add Expense</div>
      <button class="panel-close" id="addPanelClose">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="panel-body">
      <div class="form-group">
        <label class="form-label" for="expDate">Date</label>
        <input class="form-input" id="expDate" type="date" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="expCategory">Category</label>
        <select class="form-select" id="expCategory" required>
          <option value="">Select category…</option>
          <option value="Repairs">Repairs</option>
          <option value="Supplies">Supplies</option>
          <option value="Utilities">Utilities</option>
          <option value="Salaries">Salaries</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="expAmount">Amount (₱)</label>
        <input class="form-input" id="expAmount" type="number" min="0" step="0.01" placeholder="0.00" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="expPayee">Payee</label>
        <input class="form-input" id="expPayee" type="text" placeholder="Payee name" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="expNotes">Notes (optional)</label>
        <textarea class="form-input" id="expNotes" rows="3" placeholder="Additional notes…" style="resize:none;"></textarea>
      </div>
    </div>
    <div class="panel-footer">
      <button class="btn btn--accent btn--full" id="addExpenseSubmit">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Add Expense
      </button>
    </div>
  </div>
</div>

<!-- Expense detail slide-up (kept, no longer used for row clicks) -->
<div class="panel-overlay" id="detailPanel">
  <div class="panel" role="dialog" aria-label="Expense Detail">
    <div class="panel-header">
      <div class="panel-title" id="detailTitle">Expense Detail</div>
      <button class="panel-close" id="detailClose">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="panel-body" id="detailBody"></div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="confirm-overlay" id="deleteExpenseConfirm">
  <div class="confirm-dialog">
    <div class="confirm-title">Delete Expense</div>
    <div class="confirm-body">Delete this expense? This cannot be undone.</div>
    <div class="confirm-actions">
      <button class="btn btn--outline" id="deleteExpenseCancel">Cancel</button>
      <button class="btn btn--danger" id="deleteExpenseConfirmBtn">Delete</button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script src="../assets/config.js"></script>
<script src="../assets/admin-auth.js"></script>
<script src="../assets/quick-payment.js"></script>
<script>
(function () {
  validateStoredAdminToken();

  const drawer = document.getElementById('moreDrawer');
  document.getElementById('moreBtn').addEventListener('click', () => drawer.classList.add('open'));
  drawer.addEventListener('click', (e) => { if (e.target === drawer) drawer.classList.remove('open'); });

  const now = new Date();
  const currentMonthStr = now.toISOString().substring(0, 7);

  // Set default date to today
  document.getElementById('expDate').value = now.toISOString().substring(0, 10);

  function escHtml(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function peso(n) {
    return '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function formatDate(str) {
    if (!str) return '—';
    const d = new Date(str + 'T00:00:00');
    return d.toLocaleDateString('en-PH', { month: 'long', day: 'numeric', year: 'numeric' });
  }
  function showToast(msg, type) {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    const ok = type === 'success';
    t.className = 'alert alert--' + (ok ? 'success' : 'danger') + ' toast';
    t.innerHTML = ok
      ? '<svg viewBox="0 0 24 24" width="18" height="18"><polyline points="20 6 9 17 4 12"/></svg><span>' + msg + '</span>'
      : '<svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>' + msg + '</span>';
    c.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }
  async function postJSON(payload) {
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  function catBadgeClass(cat) {
    const map = {
      Repairs: 'badge-cat--repairs',
      Supplies: 'badge-cat--supplies',
      Utilities: 'badge-cat--utilities',
      Salaries: 'badge-cat--salaries',
      Other: 'badge-cat--other'
    };
    return 'badge-cat ' + (map[cat] || 'badge-cat--other');
  }

  let allExpenses = [];

  // Edit mode state
  let isEditMode = false;
  let editExpenseId = null;

  function resetAddPanel() {
    isEditMode = false;
    editExpenseId = null;
    document.getElementById('addPanelTitle').textContent = 'Add Expense';
    document.getElementById('addExpenseSubmit').innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Add Expense';
    document.getElementById('expDate').value = now.toISOString().substring(0, 10);
    document.getElementById('expCategory').value = '';
    document.getElementById('expAmount').value = '';
    document.getElementById('expPayee').value = '';
    document.getElementById('expNotes').value = '';
  }

  function openEditExpense(expense) {
    isEditMode = true;
    editExpenseId = expense.ExpenseID;
    document.getElementById('addPanelTitle').textContent = 'Edit Expense';
    document.getElementById('addExpenseSubmit').innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Save Changes';
    document.getElementById('expDate').value = expense.Date || '';
    document.getElementById('expCategory').value = expense.Category || '';
    document.getElementById('expAmount').value = expense.Amount || '';
    document.getElementById('expPayee').value = expense.Payee || '';
    document.getElementById('expNotes').value = expense.Notes || '';
    document.getElementById('addExpensePanel').classList.add('open');
  }

  // Delete confirm state
  let pendingDeleteId = null;

  function openDeleteConfirm(expenseId) {
    pendingDeleteId = expenseId;
    document.getElementById('deleteExpenseConfirm').classList.add('open');
  }

  document.getElementById('deleteExpenseCancel').addEventListener('click', () => {
    pendingDeleteId = null;
    document.getElementById('deleteExpenseConfirm').classList.remove('open');
  });

  document.getElementById('deleteExpenseConfirmBtn').addEventListener('click', async function () {
    if (!pendingDeleteId) return;
    const expenseId = pendingDeleteId;
    pendingDeleteId = null;
    document.getElementById('deleteExpenseConfirm').classList.remove('open');

    try {
      const json = await postJSON({
        action: 'deleteExpense',
        adminToken: localStorage.getItem('adminToken'),
        expenseId: expenseId
      });
      if (!json.success) throw new Error(json.error || 'Failed to delete expense');
      showToast('Expense deleted', 'success');
      await loadExpenses();
    } catch (err) {
      showToast(err.message || 'Failed to delete expense', 'error');
    }
  });

  // Active accordion index
  let openAccIdx = null;

  // Active dot menu index
  let openDotIdx = null;

  function closeAllDotMenus() {
    document.querySelectorAll('.expense-dot-menu').forEach(m => m.remove());
    openDotIdx = null;
  }

  function buildAccordionContent(e) {
    const notes = String(e.Notes || '');
    const idx = allExpenses.indexOf(e);
    return '<div class="expense-acc-inner">'
      + '<div class="expense-acc-detail-row">'
      + '<span class="expense-acc-label">Notes</span>'
      + '<span class="expense-acc-value">' + escHtml(notes || '—') + '</span>'
      + '</div>'
      + '<div class="expense-acc-actions">'
      + '<button class="btn btn--outline btn--sm acc-edit-btn" data-idx="' + idx + '">Edit</button>'
      + '<button class="btn btn--ghost btn--sm acc-delete-btn" style="color:var(--danger);" data-idx="' + idx + '">Delete</button>'
      + '</div>'
      + '</div>';
  }

  async function loadExpenses() {
    const loading = document.getElementById('loadingState');
    const error = document.getElementById('errorState');
    const content = document.getElementById('expensesContent');
    const monthFilter = document.getElementById('monthFilter').value;

    openAccIdx = null;
    closeAllDotMenus();

    loading.classList.remove('hidden'); loading.style.display = 'flex';
    error.classList.add('hidden');
    content.classList.add('hidden');

    const timeoutId = setTimeout(() => {
      loading.style.display = 'none';
      error.classList.remove('hidden');
      document.getElementById('errorMsg').textContent = 'Request timed out after 10 seconds.';
    }, 10000);

    try {
      const monthParam = monthFilter === 'all' ? '' : currentMonthStr;
      const url = CONFIG.APPS_SCRIPT_URL + '?action=getExpenses' + (monthParam ? '&month=' + encodeURIComponent(monthParam) : '');
      const res = await fetch(url);
      const json = await res.json();
      clearTimeout(timeoutId);

      if (!json.success) throw new Error(json.error || 'Failed to load expenses');

      allExpenses = json.data || [];
      loading.style.display = 'none';
      content.classList.remove('hidden');
      renderExpenses(allExpenses, monthFilter);
    } catch (err) {
      clearTimeout(timeoutId);
      loading.style.display = 'none';
      error.classList.remove('hidden');
      document.getElementById('errorMsg').textContent = err.message || 'Failed to load expenses.';
    }
  }

  function renderExpenses(expenses, filter) {
    const tableWrap = document.getElementById('tableWrap');
    const emptyState = document.getElementById('emptyState');
    const summaryTotal = document.getElementById('summaryTotal');
    const summaryPeriod = document.getElementById('summaryPeriod');

    const total = expenses.reduce((sum, e) => sum + (parseFloat(e.Amount) || 0), 0);
    summaryTotal.textContent = 'Total: ' + peso(total);
    summaryPeriod.textContent = filter === 'all'
      ? 'All Time'
      : now.toLocaleDateString('en-PH', { month: 'long', year: 'numeric' });

    if (expenses.length === 0) {
      tableWrap.innerHTML = '';
      emptyState.classList.remove('hidden');
      return;
    }

    emptyState.classList.add('hidden');

    const dotSvg = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">'
      + '<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>'
      + '</svg>';
    const chevronSvg = '<svg class="expense-chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

    let rows = '';
    expenses.forEach((e, idx) => {
      rows += '<tr class="expense-tr" data-idx="' + idx + '">'
        + '<td style="white-space:nowrap;">' + escHtml(formatDate(e.Date)) + '</td>'
        + '<td><span class="' + catBadgeClass(e.Category) + '">' + escHtml(e.Category || '—') + '</span></td>'
        + '<td>' + escHtml(e.Payee || '—') + '</td>'
        + '<td class="col-amount-right">' + peso(e.Amount) + '</td>'
        + '<td style="text-align:right;padding:6px 8px;"><div class="expense-dot-wrap">'
        + '<button class="expense-dot-btn" data-idx="' + idx + '" aria-label="Options">' + dotSvg + '</button>'
        + '</div></td>'
        + '<td class="expense-chevron-cell">' + chevronSvg + '</td>'
        + '</tr>'
        + '<tr class="expense-acc-row"><td colspan="6"><div class="expense-acc-body" id="eacc-' + idx + '">'
        + buildAccordionContent(e)
        + '</div></td></tr>';
    });

    tableWrap.innerHTML = '<table>'
      + '<thead><tr>'
      + '<th>Date</th><th>Category</th><th>Payee</th><th style="text-align:right;">Amount</th><th></th><th>&#8250;</th>'
      + '</tr></thead>'
      + '<tbody>' + rows + '</tbody></table>';

    // Row click — toggle accordion (not on dot button or chevron cell directly)
    tableWrap.querySelectorAll('tbody tr.expense-tr').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('.expense-dot-wrap')) return;
        const idx = parseInt(row.dataset.idx, 10);
        if (isNaN(idx)) return;
        const accBody = document.getElementById('eacc-' + idx);
        if (!accBody) return;
        const chevron = row.querySelector('.expense-chevron');

        if (openAccIdx === idx) {
          // Collapse same row
          accBody.classList.remove('open');
          if (chevron) chevron.classList.remove('open');
          openAccIdx = null;
        } else {
          // Close previously open
          if (openAccIdx !== null) {
            const prev = document.getElementById('eacc-' + openAccIdx);
            if (prev) prev.classList.remove('open');
            const prevRow = tableWrap.querySelector('tr.expense-tr[data-idx="' + openAccIdx + '"]');
            if (prevRow) {
              const prevChevron = prevRow.querySelector('.expense-chevron');
              if (prevChevron) prevChevron.classList.remove('open');
            }
          }
          accBody.classList.add('open');
          if (chevron) chevron.classList.add('open');
          openAccIdx = idx;
        }
        closeAllDotMenus();
      });
    });

    // Dot button click
    tableWrap.querySelectorAll('.expense-dot-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = parseInt(btn.dataset.idx, 10);

        // If same menu already open, close it
        if (openDotIdx === idx) {
          closeAllDotMenus();
          return;
        }

        closeAllDotMenus();
        openDotIdx = idx;

        const wrap = btn.closest('.expense-dot-wrap');
        const menu = document.createElement('div');
        menu.className = 'expense-dot-menu';
        menu.innerHTML =
          '<button class="edit-opt" data-idx="' + idx + '">'
          + '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;vertical-align:middle;"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Edit'
          + '</button>'
          + '<button class="delete-opt" data-idx="' + idx + '">'
          + '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;vertical-align:middle;"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>Delete'
          + '</button>';
        wrap.appendChild(menu);

        menu.querySelector('.edit-opt').addEventListener('click', (ev) => {
          ev.stopPropagation();
          closeAllDotMenus();
          openEditExpense(allExpenses[idx]);
        });
        menu.querySelector('.delete-opt').addEventListener('click', (ev) => {
          ev.stopPropagation();
          closeAllDotMenus();
          openDeleteConfirm(allExpenses[idx].ExpenseID);
        });
      });
    });

    // Accordion Edit/Delete buttons
    tableWrap.addEventListener('click', (e) => {
      const editBtn = e.target.closest('.acc-edit-btn');
      if (editBtn) {
        e.stopPropagation();
        const idx = parseInt(editBtn.dataset.idx, 10);
        if (!isNaN(idx)) openEditExpense(allExpenses[idx]);
        return;
      }
      const delBtn = e.target.closest('.acc-delete-btn');
      if (delBtn) {
        e.stopPropagation();
        const idx = parseInt(delBtn.dataset.idx, 10);
        if (!isNaN(idx)) openDeleteConfirm(allExpenses[idx].ExpenseID);
      }
    });
  }

  function openDetail(e) {
    const notes = String(e.Notes || '');
    document.getElementById('detailTitle').textContent = e.Category + ' — ' + formatDate(e.Date);
    document.getElementById('detailBody').innerHTML =
      '<div class="detail-amount">' + peso(e.Amount) + '</div>'
      + '<div class="detail-row"><span class="detail-label">Date</span><span class="detail-value">' + escHtml(formatDate(e.Date)) + '</span></div>'
      + '<div class="detail-row"><span class="detail-label">Category</span><span class="detail-value"><span class="' + catBadgeClass(e.Category) + '">' + escHtml(e.Category || '—') + '</span></span></div>'
      + '<div class="detail-row"><span class="detail-label">Payee</span><span class="detail-value">' + escHtml(e.Payee || '—') + '</span></div>'
      + '<div class="detail-row"><span class="detail-label">Expense ID</span><span class="detail-value" style="font-family:monospace;font-size:11px;">' + escHtml(e.ExpenseID || '—') + '</span></div>'
      + (notes ? '<div class="detail-row"><span class="detail-label">Notes</span><span class="detail-value">' + escHtml(notes) + '</span></div>' : '');
    document.getElementById('detailPanel').classList.add('open');
  }

  // Month filter change
  document.getElementById('monthFilter').addEventListener('change', loadExpenses);

  // Add Expense panel
  document.getElementById('addExpenseBtn').addEventListener('click', () => {
    resetAddPanel();
    document.getElementById('addExpensePanel').classList.add('open');
  });
  document.getElementById('addPanelClose').addEventListener('click', () => {
    document.getElementById('addExpensePanel').classList.remove('open');
    resetAddPanel();
  });
  document.getElementById('addExpensePanel').addEventListener('click', (e) => {
    if (e.target === document.getElementById('addExpensePanel')) {
      document.getElementById('addExpensePanel').classList.remove('open');
      resetAddPanel();
    }
  });

  // Detail panel close
  document.getElementById('detailClose').addEventListener('click', () => {
    document.getElementById('detailPanel').classList.remove('open');
  });
  document.getElementById('detailPanel').addEventListener('click', (e) => {
    if (e.target === document.getElementById('detailPanel'))
      document.getElementById('detailPanel').classList.remove('open');
  });

  // Close dot menus when clicking outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.expense-dot-wrap')) {
      closeAllDotMenus();
    }
  });

  // Submit add / edit expense
  document.getElementById('addExpenseSubmit').addEventListener('click', async function () {
    const date     = document.getElementById('expDate').value.trim();
    const category = document.getElementById('expCategory').value;
    const amount   = parseFloat(document.getElementById('expAmount').value) || 0;
    const payee    = document.getElementById('expPayee').value.trim();
    const notes    = document.getElementById('expNotes').value.trim();

    if (!date || !category || amount <= 0 || !payee) {
      showToast('Please fill in all required fields.', 'error');
      return;
    }

    this.disabled = true;
    this.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;"></div> Saving…';

    try {
      if (isEditMode) {
        const json = await postJSON({
          action:     'updateExpense',
          adminToken: localStorage.getItem('adminToken'),
          expenseId:  editExpenseId,
          date:       date,
          category:   category,
          amount:     amount,
          payee:      payee,
          notes:      notes
        });
        if (!json.success) throw new Error(json.error || 'Failed to update expense');
        showToast('Expense updated', 'success');
      } else {
        const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action:     'addExpense',
            adminToken: localStorage.getItem('adminToken'),
            date:       date,
            category:   category,
            amount:     amount,
            payee:      payee,
            notes:      notes
          })
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.error || 'Failed to save expense');
        showToast('Expense saved.', 'success');
      }

      document.getElementById('addExpensePanel').classList.remove('open');
      resetAddPanel();
      await loadExpenses();
    } catch (err) {
      showToast(err.message || 'Failed to save expense', 'error');
    } finally {
      this.disabled = false;
      if (isEditMode) {
        this.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Save Changes';
      } else {
        this.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Add Expense';
      }
    }
  });

  async function loadPendingCount() {
    try {
      const res = await fetch(CONFIG.APPS_SCRIPT_URL + '?action=getPendingProofs');
      const json = await res.json();
      if (json.success && json.data && json.data.pendingCount > 0) {
        const dot = document.getElementById('approvalsDot');
        if (dot) dot.style.display = 'block';
      }
    } catch(e) {}
  }
  loadPendingCount();

  loadExpenses();
})();
</script>
</body>
</html>
