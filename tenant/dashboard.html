<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — JJ Apartment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    body { background: var(--off-white); }

    /* Topbar — static, not fixed */
    .t-topbar {
      background: var(--navy-900);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .t-topbar-name {
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 800;
      font-size: 15px;
      color: #fff;
      line-height: 1.1;
    }
    .t-topbar-sub {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 11px;
      color: var(--navy-300);
      margin-top: 2px;
    }
    .t-logout-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .t-logout-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #fff;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Tab bar */
    .t-tabs {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      padding: 0;
      overflow-x: auto;
    }
    .t-tabs::-webkit-scrollbar { display: none; }
    .t-tab {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-muted);
      padding: 14px 20px;
      border: none;
      background: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: all 0.15s;
      min-height: 44px;
    }
    .t-tab.active {
      color: var(--accent-dark);
      border-bottom-color: var(--accent);
    }

    /* Content area */
    .t-content {
      padding: 16px;
      max-width: 720px;
      margin: 0 auto;
    }

    /* Balance card rows */
    .bal-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 7px 0;
    }
    .bal-row-label {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .bal-row-detail {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }
    .bal-row-amount {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 13px;
      color: var(--text-primary);
      flex-shrink: 0;
      margin-left: 12px;
    }

    /* History cards */
    .hist-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 8px;
    }
    .hist-section-title {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .month-pill {
      display: inline-block;
      background: var(--navy-100);
      color: var(--navy-500);
      border-radius: var(--radius-pill);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 10px;
      padding: 2px 8px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .mode-pill {
      display: inline-block;
      background: var(--accent-light);
      color: var(--accent-dark);
      border-radius: var(--radius-pill);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 11px;
      padding: 3px 8px;
    }

    /* History controls */
    .hist-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .hist-filter-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .hist-filter-pill {
      background: var(--navy-50);
      color: var(--text-secondary);
      border-radius: var(--radius-pill);
      padding: 5px 12px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 12px;
      border: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .hist-filter-pill.active { background: var(--accent); color: #fff; }
    .hist-month-input {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      background: var(--white);
      flex-shrink: 0;
    }
    .hist-decline-reason {
      margin-top: 5px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: var(--danger);
    }

    /* Submit form */
    .submit-info {
      background: var(--warning-bg);
      border: 1px solid #fde68a;
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 16px;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 13px;
      color: var(--warning);
    }
    .submit-success {
      text-align: center;
      padding: 32px 16px;
    }
    .submit-success-icon {
      width: 48px;
      height: 48px;
      background: var(--success-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }
    .submit-success-icon svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: var(--success);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* History pill filters */
    .hist-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .hist-pill {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 5px 14px;
      background: var(--white);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1;
    }
    .hist-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .status-badge {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 10px;
      border-radius: var(--radius-pill);
      padding: 2px 8px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .status-badge--pending  { background: var(--warning-bg, #fffbeb); color: var(--warning, #d97706); }
    .status-badge--approved { background: var(--success-bg, #f0fdf4); color: var(--success, #16a34a); }
    .status-badge--declined { background: #fee2e2; color: var(--danger, #dc2626); }
    .status-badge--bill     { background: var(--navy-100, #e8ecf3); color: var(--navy-500, #3d5a8a); }
    .status-badge--credit   { background: var(--success-bg, #f0fdf4); color: var(--success, #16a34a); }
    .bill-sect-title {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

<!-- Auth check guard: runs immediately before any rendering -->
<script src="../assets/config.js"></script>
<script>
(function () {
  try {
    var s = JSON.parse(sessionStorage.getItem('tenantSession') || 'null');
    if (!s || !s.tenantId) throw new Error('no session');
    window.__tenantSession = s;
  } catch (e) {
    window.location.replace('./index.html');
  }
})();
</script>

<!-- Topbar -->
<header class="t-topbar">
  <div>
    <div class="t-topbar-name">JJ Apartment</div>
    <div class="t-topbar-sub" id="topbarSub"></div>
  </div>
  <button class="t-logout-btn" id="logoutBtn" aria-label="Sign out">
    <svg viewBox="0 0 24 24">
      <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
  </button>
</header>

<!-- Tab bar -->
<nav class="t-tabs" role="tablist">
  <button class="t-tab active" data-tab="bill"    role="tab" aria-selected="true">Bill</button>
  <button class="t-tab"        data-tab="history" role="tab">History</button>
  <button class="t-tab"        data-tab="submit"  role="tab">Submit Payment</button>
</nav>

<!-- Content -->
<div class="t-content">

  <!-- Bill tab -->
  <div id="pane-bill" class="tab-pane">
    <div id="bill-body">
      <div style="display:flex;align-items:center;gap:8px;padding:48px 0;justify-content:center;">
        <div class="spinner"></div>
        <span style="font-family:'Inter',sans-serif;font-size:13px;color:var(--text-muted);">Loading...</span>
      </div>
    </div>
  </div>

  <!-- History tab -->
  <div id="pane-history" class="tab-pane hidden">
    <div id="history-body">
      <div style="display:flex;align-items:center;gap:8px;padding:48px 0;justify-content:center;">
        <div class="spinner"></div>
        <span style="font-family:'Inter',sans-serif;font-size:13px;color:var(--text-muted);">Loading...</span>
      </div>
    </div>
  </div>

  <!-- Submit Payment tab -->
  <div id="pane-submit" class="tab-pane hidden">

    <div class="submit-info">
      Submit your payment proof here. Your landlord will verify and record your payment.
    </div>

    <!-- Success state -->
    <div id="submitSuccess" class="submit-success hidden">
      <div class="submit-success-icon">
        <svg viewBox="0 0 24 24">
          <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </div>
      <div style="font-family:'Satoshi','Inter',sans-serif;font-weight:700;font-size:18px;color:var(--success);margin-bottom:8px;">Proof submitted successfully!</div>
      <div style="font-family:'Inter',sans-serif;font-weight:400;font-size:13px;color:var(--text-secondary);margin-bottom:6px;">Your landlord will verify and record your payment shortly.</div>
      <div id="successDetail" style="font-family:'Inter',sans-serif;font-weight:400;font-size:12px;color:var(--text-muted);"></div>
    </div>

    <!-- Form state -->
    <div id="submitForm">
      <div id="submitError" class="alert alert--danger hidden" style="margin-bottom:16px;">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="submitErrorMsg">Submission failed. Please try again.</span>
      </div>

      <div class="form-card">
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label" for="refNo">GCash / Bank Reference No.</label>
          <input class="form-input" type="text" id="refNo" placeholder="e.g. 09123456789" autocomplete="off">
          <div class="form-hint">Required — this is your proof of payment</div>
        </div>

        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label" for="amtPaid">Amount Paid (&#8369;)</label>
          <input class="form-input" type="number" id="amtPaid" placeholder="0.00" min="0" step="0.01">
        </div>

        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label" for="proofFile">Payment Screenshot (Optional)</label>
          <input
            class="form-input"
            type="file"
            id="proofFile"
            accept="image/*"
            style="padding:8px 12px;cursor:pointer;"
          >
          <img
            id="imgPreview"
            class="hidden"
            src=""
            alt="Payment screenshot preview"
            style="margin-top:8px;max-height:200px;width:100%;object-fit:contain;border-radius:var(--radius-sm);border:1px solid var(--border);"
          >
          <div id="uploadStatus" class="hidden" style="margin-top:4px;">
            <span style="font-family:'Inter',sans-serif;font-size:11px;color:var(--text-muted);" id="uploadStatusText"></span>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:20px;">
          <label class="form-label" for="payNotes">Notes</label>
          <textarea
            class="form-input"
            id="payNotes"
            rows="3"
            placeholder="Any notes for your landlord"
            style="resize:vertical;min-height:80px;"
          ></textarea>
        </div>

        <button class="btn btn--accent btn--full" id="submitProofBtn" disabled>
          <span id="submitBtnText">Submit Proof</span>
          <span id="submitSpinner" class="spinner hidden" style="width:16px;height:16px;border-width:2px;border-color:rgba(255,255,255,0.3);border-top-color:#fff;"></span>
        </button>
      </div>
    </div>

  </div><!-- /pane-submit -->

</div><!-- /t-content -->

<script>
(function () {
  var session = window.__tenantSession;
  if (!session) return; // guard already redirected

  var tenantId     = session.tenantId;
  var tenantName   = session.name;
  var unitId       = session.unitId;
  var unitName     = session.unitName || '';

  // ── Topbar ──────────────────────────────────────────────────
  document.getElementById('topbarSub').textContent = tenantName + ' · ' + unitName;

  document.getElementById('logoutBtn').addEventListener('click', function () {
    sessionStorage.removeItem('tenantSession');
    window.location.href = './index.html';
  });

  // ── Tab switching ────────────────────────────────────────────
  var tabs      = document.querySelectorAll('.t-tab');
  var panes     = document.querySelectorAll('.tab-pane');
  var billLoaded    = false;
  var historyLoaded = false;

  function switchTab(id) {
    tabs.forEach(function (t) {
      var on = t.dataset.tab === id;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    panes.forEach(function (p) {
      p.classList.toggle('hidden', p.id !== 'pane-' + id);
    });
    if (id === 'bill'    && !billLoaded)    loadBillTab();
    if (id === 'history' && !historyLoaded) loadHistoryTab();
    // Reset submit form from success on tab switch
    if (id !== 'submit') resetSubmitIfSuccess();
  }

  tabs.forEach(function (t) {
    t.addEventListener('click', function () { switchTab(t.dataset.tab); });
  });

  // ── Utilities ────────────────────────────────────────────────
  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function peso(n) {
    return Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function normMonth(val) {
    return String(val || '').substring(0, 7);
  }

  function fmtDate(dateStr) {
    if (!dateStr) return '';
    try {
      var d = new Date(String(dateStr).substring(0, 10) + 'T00:00:00');
      return d.toLocaleDateString('en-PH', { month: 'long', day: 'numeric', year: 'numeric' });
    } catch (e) { return dateStr; }
  }

  function currentMonth() {
    var now = new Date();
    return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  }

  async function fetchGet(action, params) {
    var url = CONFIG.APPS_SCRIPT_URL + '?action=' + encodeURIComponent(action);
    Object.keys(params || {}).forEach(function (k) {
      url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    });
    var res  = await fetch(url);
    var json = await res.json();
    if (!json.success) throw new Error(json.error || 'Request failed');
    return json.data;
  }

  async function fetchPost(payload) {
    var res = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body:    JSON.stringify(payload)
    });
    var json = await res.json();
    if (!json.success) throw new Error(json.error || 'Request failed');
    return json.data;
  }

  function showPaneLoading(paneBodyId) {
    document.getElementById(paneBodyId).innerHTML =
      '<div style="display:flex;align-items:center;gap:8px;padding:48px 0;justify-content:center;">'
      + '<div class="spinner"></div>'
      + '<span style="font-family:\'Inter\',sans-serif;font-size:13px;color:var(--text-muted);">Loading...</span>'
      + '</div>';
  }

  function showPaneError(paneBodyId, msg) {
    document.getElementById(paneBodyId).innerHTML =
      '<div class="alert alert--danger" style="margin-top:8px;">'
      + '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">'
      + '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
      + '</svg>'
      + '<span>' + esc(msg || 'Failed to load data. Please try again.') + '</span>'
      + '</div>';
  }

  // ── TAB 1: BILL ──────────────────────────────────────────────
  async function loadBillTab() {
    showPaneLoading('bill-body');
    try {
      var preview = await fetchGet('getTenantBillPreview', { tenantId: tenantId, unitId: unitId });
      billLoaded = true;
      renderBillTab(preview);
    } catch (err) {
      showPaneError('bill-body', err.message);
    }
  }

  function fmtMonth(val) {
    if (!val) return '';
    try {
      var d = new Date(String(val).substring(0, 7) + '-01T00:00:00');
      return d.toLocaleDateString('en-PH', { month: 'long', year: 'numeric' });
    } catch (e) { return val; }
  }

  function renderBillTab(preview) {
    var balance     = parseFloat(preview.currentBalance) || 0;
    var unpaidBills = preview.unpaidBills     || [];
    var unitRate    = parseFloat(preview.unitRate) || 0;
    var utils       = preview.latestUtilities || null;
    var nextMonth   = preview.nextMonth       || '';

    var html = '';

    // --- Section 1: Current Status ---
    html += '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:16px;">';
    html += '<div class="bill-sect-title">Current Status</div>';

    if (balance === 0) {
      html += '<div style="text-align:center;padding:20px 0;">';
      html += '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 10px;display:block;">';
      html += '<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>';
      html += '</svg>';
      html += '<div style="font-family:\'Satoshi\',\'Inter\',sans-serif;font-weight:700;font-size:18px;color:var(--success);">You\'re all caught up!</div>';
      html += '<div style="font-family:\'Inter\',sans-serif;font-weight:400;font-size:13px;color:var(--text-muted);margin-top:6px;">No outstanding balance.</div>';
      html += '</div>';
    } else if (balance < 0) {
      var credit = Math.abs(balance);
      html += '<div style="text-align:center;padding:20px 0;">';
      html += '<div style="font-family:\'Satoshi\',\'Inter\',sans-serif;font-weight:700;font-size:24px;color:var(--success);">&#8369;' + peso(credit) + ' In Credit</div>';
      html += '<div style="font-family:\'Inter\',sans-serif;font-weight:400;font-size:12px;color:var(--text-muted);margin-top:8px;">Will be applied to your next bill.</div>';
      html += '</div>';
    } else {
      if (unpaidBills.length) {
        unpaidBills.forEach(function(bill) {
          html += balRowHtml(bill.billingMonth || 'Monthly Bill', bill.amount, null);
        });
      }
      html += '<div style="height:1px;background:var(--border);margin:12px 0;"></div>';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;">';
      html += '<div style="font-family:\'Inter\',sans-serif;font-weight:600;font-size:14px;color:var(--text-primary);">Total Due</div>';
      html += '<div style="font-family:\'Satoshi\',\'Inter\',sans-serif;font-weight:800;font-size:18px;color:var(--danger);">&#8369;' + peso(balance) + '</div>';
      html += '</div>';
      html += '<div style="font-family:\'Inter\',sans-serif;font-weight:400;font-size:12px;color:var(--text-muted);margin-top:8px;text-align:center;">Please pay and submit your proof below.</div>';
    }

    html += '</div>';

    // --- Section 2: Upcoming Bill ---
    html += '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">';
    html += '<div class="bill-sect-title" style="margin-bottom:0;">Upcoming Bill</div>';
    html += '<span class="status-badge status-badge--pending" style="text-transform:uppercase;">Estimated</span>';
    html += '</div>';

    if (nextMonth) {
      html += '<div style="font-family:\'Inter\',sans-serif;font-size:12px;color:var(--text-muted);margin-bottom:12px;">For ' + esc(fmtMonth(nextMonth)) + '</div>';
    }

    var elecCharge  = utils ? (parseFloat(utils.electricCharge) || 0) : 0;
    var waterCharge = utils ? (parseFloat(utils.waterCharge)    || 0) : 0;
    var elecDetail  = (utils && utils.electricKwh) ? (utils.electricKwh + ' kWh' + (utils.asOf ? ' · as of ' + utils.asOf : '')) : null;
    var waterDetail = (utils && utils.waterM3)     ? (utils.waterM3     + ' m³' + (utils.asOf ? ' · as of ' + utils.asOf : '')) : null;

    html += balRowHtml('Base Rent', unitRate, null);
    html += balRowHtml('Electric',  elecCharge,  elecDetail);
    html += balRowHtml('Water',     waterCharge, waterDetail);

    var estimated = unitRate + elecCharge + waterCharge;
    html += '<div style="height:1px;background:var(--border);margin:12px 0;"></div>';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;">';
    html += '<div style="font-family:\'Inter\',sans-serif;font-weight:600;font-size:14px;color:var(--text-primary);">Estimated Total</div>';
    html += '<div style="font-family:\'Satoshi\',\'Inter\',sans-serif;font-weight:800;font-size:17px;color:var(--text-primary);">&#8369;' + peso(estimated) + '</div>';
    html += '</div>';

    if (balance < 0) {
      var creditAmt = Math.abs(balance);
      var netDue    = Math.max(0, estimated - creditAmt);
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">';
      html += '<div style="font-family:\'Inter\',sans-serif;font-size:12px;color:var(--success);">Credit Deduction</div>';
      html += '<div style="font-family:\'Inter\',sans-serif;font-size:12px;color:var(--success);">-&#8369;' + peso(creditAmt) + '</div>';
      html += '</div>';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">';
      html += '<div style="font-family:\'Inter\',sans-serif;font-weight:600;font-size:13px;color:var(--text-primary);">Net Due</div>';
      html += '<div style="font-family:\'Satoshi\',\'Inter\',sans-serif;font-weight:700;font-size:15px;color:var(--danger);">&#8369;' + peso(netDue) + '</div>';
      html += '</div>';
    }

    if (!utils) {
      html += '<div style="font-family:\'Inter\',sans-serif;font-size:11px;color:var(--text-muted);margin-top:10px;">Utility charges are from the latest recorded reading.</div>';
    }

    html += '</div>';

    document.getElementById('bill-body').innerHTML = html;
  }

  function balRowHtml(label, amount, detail) {
    var h = '<div class="bal-row">';
    h += '<div>';
    h += '<div class="bal-row-label">' + esc(label) + '</div>';
    if (detail) h += '<div class="bal-row-detail">(' + esc(detail) + ')</div>';
    h += '</div>';
    h += '<div class="bal-row-amount">₱' + peso(amount) + '</div>';
    h += '</div>';
    return h;
  }

  // ── TAB 2: HISTORY ───────────────────────────────────────────
  var historyFilter = 'all';
  var historyMonth  = currentMonth();
  var historyData   = null;

  async function loadHistoryTab() {
    if (!historyLoaded) {
      renderHistoryFilters();
    }
    historyLoaded = true;
    showHistListLoading();
    try {
      var p = { tenantId: tenantId };
      if (historyMonth) p.month = historyMonth;
      var data = await fetchGet('getTenantHistory', p);
      historyData = data;
      renderHistList(data);
    } catch (err) {
      showHistListError(err.message);
    }
  }

  function renderHistoryFilters() {
    var html = '';
    html += '<div id="hist-filter-bar" style="margin-bottom:12px;">';
    html += '<div class="hist-pills">';
    var filters = [['all', 'All'], ['Bill', 'Bill'], ['Payment', 'Payment'], ['Credit', 'Credit']];
    filters.forEach(function(f) {
      html += '<button class="hist-pill' + (f[0] === 'all' ? ' active' : '') + '" data-filter="' + f[0] + '">' + f[1] + '</button>';
    });
    html += '</div>';
    html += '<div style="display:flex;gap:8px;align-items:center;">';
    html += '<input type="month" id="histMonthPicker" class="form-input" style="flex:1;font-size:13px;padding:7px 10px;" value="' + esc(historyMonth) + '">';
    html += '<button id="histMonthClear" class="btn btn--ghost btn--sm" style="white-space:nowrap;height:36px;">Clear</button>';
    html += '</div>';
    html += '</div>';
    html += '<div id="hist-list"></div>';

    document.getElementById('history-body').innerHTML = html;

    document.querySelectorAll('.hist-pill').forEach(function(btn) {
      btn.addEventListener('click', function() {
        historyFilter = btn.dataset.filter;
        document.querySelectorAll('.hist-pill').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        if (historyData) renderHistList(historyData);
      });
    });

    var monthPicker = document.getElementById('histMonthPicker');
    monthPicker.addEventListener('change', async function() {
      historyMonth = monthPicker.value;
      showHistListLoading();
      try {
        var p = { tenantId: tenantId };
        if (historyMonth) p.month = historyMonth;
        var data = await fetchGet('getTenantHistory', p);
        historyData = data;
        renderHistList(data);
      } catch (err) {
        showHistListError(err.message);
      }
    });

    document.getElementById('histMonthClear').addEventListener('click', async function() {
      historyMonth = '';
      document.getElementById('histMonthPicker').value = '';
      showHistListLoading();
      try {
        var data = await fetchGet('getTenantHistory', { tenantId: tenantId });
        historyData = data;
        renderHistList(data);
      } catch (err) {
        showHistListError(err.message);
      }
    });
  }

  function showHistListLoading() {
    var el = document.getElementById('hist-list');
    if (!el) return;
    el.innerHTML = '<div style="display:flex;align-items:center;gap:8px;padding:32px 0;justify-content:center;"><div class="spinner"></div><span style="font-family:\'Inter\',sans-serif;font-size:13px;color:var(--text-muted);">Loading...</span></div>';
  }

  function showHistListError(msg) {
    var el = document.getElementById('hist-list');
    if (!el) return;
    el.innerHTML = '<div class="alert alert--danger" style="margin-top:8px;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>' + esc(msg || 'Failed to load history.') + '</span></div>';
  }

  function renderHistList(data) {
    var el = document.getElementById('hist-list');
    if (!el) return;
    var items = (data || []).filter(function(item) {
      if (historyFilter === 'all') return true;
      return item._type === historyFilter;
    });
    if (!items.length) {
      el.innerHTML = '<div style="text-align:center;padding:32px 0;font-family:\'Inter\',sans-serif;font-size:13px;color:var(--text-muted);">No transactions found.</div>';
      return;
    }
    var html = '';
    items.forEach(function(item) {
      if (item._type === 'Bill')    html += renderHistBillCard(item);
      else if (item._type === 'Credit') html += renderHistCreditCard(item);
      else html += renderHistPaymentCard(item);
    });
    el.innerHTML = html;
  }

  function renderHistPaymentCard(item) {
    var status    = String(item.status || 'Pending');
    var statusKey = status.toLowerCase();
    var badgeClass = 'status-badge--' + statusKey;
    var amt = parseFloat(item.amount) || 0;
    var month = item.billingMonth || '';
    var h = '<div class="hist-card">';
    h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">';
    h += '<div style="flex:1;min-width:0;">';
    h += '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;">';
    h += '<span style="font-family:\'Inter\',sans-serif;font-weight:500;font-size:13px;color:var(--text-primary);">' + esc(fmtDate(item.date)) + '</span>';
    if (month) h += '<span class="month-pill">' + esc(month) + '</span>';
    h += '</div>';
    if (item.paymentMode || item.referenceNo) {
      h += '<div style="margin-top:4px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;">';
      if (item.paymentMode) h += '<span class="mode-pill">' + esc(item.paymentMode) + '</span>';
      if (item.referenceNo) h += '<span style="font-family:\'SF Mono\',\'Fira Code\',monospace;font-size:11px;color:var(--text-muted);">' + esc(item.referenceNo) + '</span>';
      h += '</div>';
    }
    h += '</div>';
    h += '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;">';
    h += '<span class="status-badge ' + badgeClass + '">' + esc(status) + '</span>';
    h += '<div style="font-family:\'Satoshi\',\'Inter\',sans-serif;font-weight:700;font-size:15px;color:var(--success);">&#8369;' + peso(amt) + '</div>';
    h += '</div>';
    h += '</div>';
    if (status === 'Declined' && item.declineReason) {
      h += '<div style="margin-top:8px;font-family:\'Inter\',sans-serif;font-size:12px;color:var(--danger);border-top:1px solid #fee2e2;padding-top:8px;">';
      h += 'Reason: ' + esc(item.declineReason);
      h += '</div>';
    }
    h += '</div>';
    return h;
  }

  function renderHistBillCard(item) {
    var month = item.billingMonth || '';
    var amt   = parseFloat(item.amount) || 0;
    var rent  = parseFloat(item.rentAmount)  || 0;
    var elec  = parseFloat(item.elecAmount)  || 0;
    var water = parseFloat(item.waterAmount) || 0;
    var h = '<div class="hist-card">';
    h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">';
    h += '<div>';
    h += '<div style="display:flex;align-items:center;gap:6px;">';
    h += '<span style="font-family:\'Inter\',sans-serif;font-weight:600;font-size:13px;color:var(--text-primary);">' + esc(month) + '</span>';
    h += '<span class="status-badge status-badge--bill">Bill</span>';
    h += '</div>';
    h += '<div style="font-family:\'Inter\',sans-serif;font-weight:400;font-size:11px;color:var(--text-muted);margin-top:4px;">';
    h += 'Rent &#8369;' + peso(rent) + ' &middot; Elec &#8369;' + peso(elec) + ' &middot; Water &#8369;' + peso(water);
    h += '</div>';
    h += '</div>';
    h += '<div style="font-family:\'Satoshi\',\'Inter\',sans-serif;font-weight:700;font-size:15px;color:var(--text-primary);flex-shrink:0;">&#8369;' + peso(amt) + '</div>';
    h += '</div>';
    h += '</div>';
    return h;
  }

  function renderHistCreditCard(item) {
    var amt   = parseFloat(item.amount) || 0;
    var month = item.billingMonth || '';
    var h = '<div class="hist-card">';
    h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">';
    h += '<div style="flex:1;min-width:0;">';
    h += '<div style="display:flex;align-items:center;gap:6px;">';
    h += '<span style="font-family:\'Inter\',sans-serif;font-weight:500;font-size:13px;color:var(--text-primary);">' + esc(fmtDate(item.date)) + '</span>';
    h += '<span class="status-badge status-badge--credit">Credit</span>';
    h += '</div>';
    if (month) h += '<span class="month-pill" style="margin-top:4px;display:inline-block;">' + esc(month) + '</span>';
    if (item.notes) h += '<div style="font-family:\'Inter\',sans-serif;font-size:12px;color:var(--text-muted);margin-top:4px;">' + esc(item.notes) + '</div>';
    h += '</div>';
    h += '<div style="font-family:\'Satoshi\',\'Inter\',sans-serif;font-weight:700;font-size:15px;color:var(--success);flex-shrink:0;">&#8369;' + peso(amt) + '</div>';
    h += '</div>';
    h += '</div>';
    return h;
  }

  // ── TAB 3: SUBMIT PAYMENT ────────────────────────────────────
  var driveUrl  = '';
  var uploading = false;

  var refInput    = document.getElementById('refNo');
  var amtInput    = document.getElementById('amtPaid');
  var fileInput   = document.getElementById('proofFile');
  var notesInput  = document.getElementById('payNotes');
  var submitBtn   = document.getElementById('submitProofBtn');
  var submitBtnTxt = document.getElementById('submitBtnText');
  var submitSpinner = document.getElementById('submitSpinner');
  var imgPreview  = document.getElementById('imgPreview');
  var uploadStatus = document.getElementById('uploadStatus');
  var uploadStatusTxt = document.getElementById('uploadStatusText');
  var successEl   = document.getElementById('submitSuccess');
  var formEl      = document.getElementById('submitForm');
  var errorEl     = document.getElementById('submitError');
  var errorMsgEl  = document.getElementById('submitErrorMsg');
  var successDetail = document.getElementById('successDetail');

  function updateSubmitBtn() {
    submitBtn.disabled = uploading || !refInput.value.trim() || !amtInput.value || parseFloat(amtInput.value) <= 0;
  }

  refInput.addEventListener('input', updateSubmitBtn);
  amtInput.addEventListener('input', updateSubmitBtn);

  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function (e) { resolve(e.target.result.split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  fileInput.addEventListener('change', async function () {
    var file = fileInput.files[0];
    if (!file) return;

    // Show preview
    var previewReader = new FileReader();
    previewReader.onload = function (e) {
      imgPreview.src = e.target.result;
      imgPreview.classList.remove('hidden');
    };
    previewReader.readAsDataURL(file);

    // Upload to Drive
    driveUrl  = '';
    uploading = true;
    updateSubmitBtn();
    uploadStatus.classList.remove('hidden');
    uploadStatusTxt.textContent = 'Uploading screenshot...';

    try {
      var base64 = await fileToBase64(file);
      var result = await fetchPost({
        action:      'uploadProof',
        adminToken:  'tenant',
        base64Image: base64,
        fileName:    file.name
      });
      driveUrl = result.driveUrl || '';
      uploadStatusTxt.textContent = 'Screenshot uploaded.';
    } catch (err) {
      uploadStatusTxt.textContent = 'Screenshot upload failed (will submit without it).';
      driveUrl = '';
    } finally {
      uploading = false;
      updateSubmitBtn();
    }
  });

  var resetTimer = null;

  function resetSubmitIfSuccess() {
    if (!successEl.classList.contains('hidden')) {
      successEl.classList.add('hidden');
      formEl.classList.remove('hidden');
      clearTimeout(resetTimer);
      resetSubmitForm();
    }
  }

  function resetSubmitForm() {
    refInput.value   = '';
    amtInput.value   = '';
    notesInput.value = '';
    fileInput.value  = '';
    imgPreview.src   = '';
    imgPreview.classList.add('hidden');
    uploadStatus.classList.add('hidden');
    uploadStatusTxt.textContent = '';
    driveUrl  = '';
    uploading = false;
    errorEl.classList.add('hidden');
    updateSubmitBtn();
  }

  submitBtn.addEventListener('click', async function () {
    var refNo  = refInput.value.trim();
    var amount = parseFloat(amtInput.value);
    var notes  = notesInput.value.trim();

    if (!refNo || isNaN(amount) || amount <= 0) return;

    errorEl.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtnTxt.textContent = 'Submitting...';
    submitSpinner.classList.remove('hidden');

    try {
      var submittedAt = new Date().toISOString();
      await fetchPost({
        action:        'submitPaymentProof',
        tenantId:      tenantId,
        unitId:        unitId,
        unitName:      unitName,
        billingMonth:  currentMonth(),
        referenceNo:   refNo,
        amountPaid:    amount,
        driveUrl:      driveUrl,
        notes:         notes,
        submittedAt:   submittedAt
      });

      successDetail.textContent = 'Reference: ' + refNo + ' · ₱' + peso(amount);
      formEl.classList.add('hidden');
      successEl.classList.remove('hidden');

      resetTimer = setTimeout(function () {
        successEl.classList.add('hidden');
        formEl.classList.remove('hidden');
        resetSubmitForm();
      }, 5000);

    } catch (err) {
      errorMsgEl.textContent = err.message || 'Submission failed. Please try again.';
      errorEl.classList.remove('hidden');
    } finally {
      submitBtn.disabled = false;
      submitBtnTxt.textContent = 'Submit Proof';
      submitSpinner.classList.add('hidden');
      updateSubmitBtn();
    }
  });

  // ── Init ─────────────────────────────────────────────────────
  loadBillTab();
  switchTab('bill');
})();
</script>
</body>
</html>
