<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenant Login — JJ Apartment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,800&display=swap" rel="stylesheet">
  <!-- PWA META — added in Step 6 -->
  <link rel="manifest" href="/JJariel-RMS/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JJ Apartment">
  <link rel="apple-touch-icon" href="/JJariel-RMS/assets/icons/icon-192.png">
  <!-- END PWA META -->
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <div class="login-logo-name">JJ Apartment</div>
      <div class="login-logo-sub" style="margin-top:6px;">Tenant Portal</div>
    </div>

    <div style="width:100%;">
      <div class="form-group" style="margin-bottom:14px;">
        <label class="form-label" for="unitId">Unit ID</label>
        <input
          class="form-input"
          type="text"
          id="unitId"
          placeholder="e.g. APT-01"
          autocomplete="off"
          autocapitalize="characters"
          style="text-transform:uppercase;"
        >
      </div>

      <div class="form-group" style="margin-bottom:8px;">
        <label class="form-label" for="pin">PIN</label>
        <input
          class="form-input"
          type="password"
          id="pin"
          placeholder="4-digit PIN"
          maxlength="4"
          inputmode="numeric"
          autocomplete="current-password"
        >
      </div>

      <div id="loginError" style="display:none;margin-bottom:12px;">
        <span style="font-family:'Inter',sans-serif;font-weight:400;font-size:12px;color:var(--danger);">
          Incorrect Unit ID or PIN. Please try again.
        </span>
      </div>

      <button class="btn btn--primary btn--full" id="loginBtn" style="margin-top:8px;">
        <span id="loginBtnText">Sign In</span>
        <span id="loginSpinner" class="spinner hidden" style="width:16px;height:16px;border-width:2px;border-color:rgba(255,255,255,0.3);border-top-color:#fff;"></span>
      </button>
    </div>

  </div>
</div>

<script src="../assets/config.js"></script>
<script>
(function () {
  // If already logged in, redirect to dashboard
  try {
    var existing = JSON.parse(sessionStorage.getItem('tenantSession') || 'null');
    if (existing && existing.tenantId) {
      window.location.href = './dashboard.html';
      return;
    }
  } catch (e) {}

  var unitInput  = document.getElementById('unitId');
  var pinInput   = document.getElementById('pin');
  var loginBtn   = document.getElementById('loginBtn');
  var btnText    = document.getElementById('loginBtnText');
  var spinner    = document.getElementById('loginSpinner');
  var errorBox   = document.getElementById('loginError');

  // Auto-uppercase unit ID
  unitInput.addEventListener('input', function () {
    var pos = unitInput.selectionStart;
    unitInput.value = unitInput.value.toUpperCase();
    unitInput.setSelectionRange(pos, pos);
  });

  function setLoading(on) {
    loginBtn.disabled = on;
    btnText.textContent = on ? 'Signing in...' : 'Sign In';
    spinner.classList.toggle('hidden', !on);
  }

  function showError() {
    errorBox.style.display = 'block';
  }

  function hideError() {
    errorBox.style.display = 'none';
  }

  async function doLogin() {
    var unitId = unitInput.value.trim().toUpperCase();
    var pin    = pinInput.value.trim();

    hideError();

    if (!unitId) { unitInput.focus(); return; }
    if (!pin)    { pinInput.focus();  return; }

    setLoading(true);
    try {
      var url = CONFIG.APPS_SCRIPT_URL
        + '?action=verifyTenant'
        + '&unitId=' + encodeURIComponent(unitId)
        + '&pin='    + encodeURIComponent(pin);

      var res  = await fetch(url);
      var json = await res.json();

      if (!json.success) throw new Error(json.error || 'Invalid credentials');

      var d = json.data;
      var session = {
        tenantId:     d.TenantID     || '',
        name:         d.Name         || '',
        unitId:       d.UnitID       || unitId,
        unitName:     d.UnitName     || '',
        buildingName: d.BuildingName || '',
        email:        d.Email        || ''
      };
      sessionStorage.setItem('tenantSession', JSON.stringify(session));
      window.location.href = './dashboard.html';
    } catch (err) {
      showError();
      pinInput.value = '';
      pinInput.focus();
    } finally {
      setLoading(false);
    }
  }

  loginBtn.addEventListener('click', doLogin);
  pinInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  unitInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') pinInput.focus(); });
})();
</script>
</body>
</html>
